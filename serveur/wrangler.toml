# Serveur de ds-retro : salons du canapé partagé + sauvegardes dans le cloud.
# Secret à ajouter dans Cloudflare (jamais dans ce fichier) : DISCORD_CLIENT_SECRET
name = "ds-retro-serveur"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
DISCORD_CLIENT_ID = "1575525217894404309"

[[durable_objects.bindings]]
name = "SALLES"
class_name = "Salle"

[[durable_objects.bindings]]
name = "COFFRES"
class_name = "Coffre"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Salle", "Coffre"]

# Les jeux de la ludothèque (fichiers privés de chaque joueur)
[[r2_buckets]]
binding = "JEUX"
bucket_name = "ds-retro-jeux"

[[durable_objects.bindings]]
name = "REGISTRE"
class_name = "Registre"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registre"]
