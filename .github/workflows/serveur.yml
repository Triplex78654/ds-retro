# Publie le serveur (serveur/) sur Cloudflare à chaque modification.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN   clé Cloudflare « Modifier Cloudflare Workers »
#   DISCORD_CLIENT_SECRET  code secret OAuth2 de l'appli Discord
name: Publier le serveur

on:
  push:
    branches: [main]
    paths: ["serveur/**", ".github/workflows/serveur.yml"]
  workflow_dispatch:

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4e4b774140d9bcbea6c97961b2ce7cee
          workingDirectory: serveur
          wranglerVersion: "4.168.0"
          secrets: |
            DISCORD_CLIENT_SECRET
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
