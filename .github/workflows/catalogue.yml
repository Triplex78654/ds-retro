# Quand un jeu est ajouté ou retiré dans catalogue/, met à jour catalogue/jeux.json.
name: Mettre à jour le catalogue

on:
  push:
    branches: [main]
    paths: ["catalogue/**", "outils-depot/catalogue.mjs", ".github/workflows/catalogue.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node outils-depot/catalogue.mjs
      - name: Enregistrer la liste
        run: |
          if git diff --quiet; then echo "Rien à changer."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/jeux.json
          git commit -m "Catalogue : liste mise à jour"
          git push
