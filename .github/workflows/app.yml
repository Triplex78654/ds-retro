# Construit l'appli Windows « Rétro » (installateur + version portable).
# - À chaque modification de l'appli ou de la console : fichiers à télécharger dans l'onglet Actions.
# - Pour publier (Releases + bouton de mise à jour de l'appli) : Actions → Appli Windows → Run workflow → cocher « Publier ».
name: Appli Windows

on:
  push:
    branches: [main]
    paths: ["app/**", "console/**", "console.js", "index.html", "emulateur/**", ".github/workflows/app.yml"]
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier cette version (le bouton de mise à jour de l'appli la proposera)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Installer
        working-directory: app
        run: npm ci
      - name: Construire l'installateur
        working-directory: app
        run: npm run construire
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Garder les fichiers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Retro-Windows
          path: |
            app/dist/*.exe
            app/dist/latest.yml
          if-no-files-found: error
      - name: Publier la version
        # Lancé à la main (Actions → Appli Windows → Run workflow → cocher « Publier ») ou par une étiquette app-vX.Y.Z.
        # Le numéro de version vient de app/package.json.
        if: inputs.publier || startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          etiquette="app-v${version}"
          if gh release view "$etiquette" >/dev/null 2>&1; then
            echo "::error::La version ${version} est déjà publiée : change le numéro de version dans app/package.json."
            exit 1
          fi
          gh release create "$etiquette" app/dist/*.exe app/dist/latest.yml app/dist/*.blockmap \
            --target "$GITHUB_SHA" \
            --title "Rétro ${version}" \
            --notes "Appli Windows Rétro. Prends l'installateur (Setup) ou la version portable. Avec l'installateur, les versions suivantes s'installent depuis l'appli (bouton en bas de l'accueil). Windows peut afficher un avertissement car l'appli n'est pas signée : « Informations complémentaires », puis « Exécuter quand même »."
