# Construit l'appli Windows « Rétro » (installateur + version portable).
# - À chaque modification de l'appli ou de la console : fichiers à télécharger dans l'onglet Actions.
# - Avec une étiquette app-vX.Y.Z : une version publiée dans « Releases », à donner à tes potes.
name: Appli Windows

on:
  push:
    branches: [main]
    paths: ["app/**", "console/**", "console.js", "index.html", "emulateur/**", ".github/workflows/app.yml"]
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Installer
        working-directory: app
        run: npm ci
      - name: Construire l'installateur
        working-directory: app
        run: npm run construire
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Garder les fichiers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Retro-Windows
          path: |
            app/dist/*.exe
          if-no-files-found: error
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app/dist/*.exe \
            --title "Rétro ${GITHUB_REF_NAME#app-v}" \
            --notes "Appli Windows Rétro. Prends l'installateur (Setup) ou la version portable. Windows peut afficher un avertissement car l'appli n'est pas signée : « Informations complémentaires », puis « Exécuter quand même »."
