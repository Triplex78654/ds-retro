<!DOCTYPE html>
<html lang="fr" data-theme="perle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<link rel="icon" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/icone-180.png">
<title>Rétro · console DS</title>
<script src="config.js"></script>
<script src="discord-sdk.js"></script>
<link rel="stylesheet" href="console/styles/00-polices.css">
<link rel="stylesheet" href="console/styles/01-themes.css">
<link rel="stylesheet" href="console/styles/02-console.css">
<link rel="stylesheet" href="console/styles/03-menu.css">
<link rel="stylesheet" href="console/styles/04-salon.css">
<link rel="stylesheet" href="console/styles/05-decors.css">
<link rel="stylesheet" href="console/styles/06-formats.css">
</head>
<body>

<div id="console">
  <div class="hp g" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="hp d" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="zone-ecrans">
    <div class="vitre-haut" aria-hidden="true"></div>
    <div class="vitre-bas" aria-hidden="true"></div>
    <div class="ecrans-eteints" aria-hidden="true"></div>
    <div id="game"></div>
    <canvas id="ecran-distant" width="256" height="448" hidden></canvas>
    <video id="video-distante" playsinline hidden></video>
    <div class="pastilles-spectateur" id="pastilles-spectateur" hidden></div>
    <div class="bulle" id="bulle" role="status" hidden></div>

    <div id="menu" data-onglet="jeux">
      <section class="lcd haut" aria-label="Écran du haut">
        <div class="bandeau">
          <span>Rétro</span>
          <span class="signal"><span class="manette-ok" id="manette-ok" hidden><svg viewBox="0 0 16 10" aria-hidden="true"><path fill="currentColor" d="M4 0h8a4 4 0 0 1 4 4v2a4 4 0 0 1-7 2.6H7A4 4 0 0 1 0 6V4a4 4 0 0 1 4-4z"/><path fill="var(--accent)" d="M3 4h1V3h1v1h1v1H5v1H4V5H3zM11 3h1v1h-1zM12 5h1v1h-1z"/></svg>Manette</span><span id="lieu">Navigateur</span><span class="barres" aria-hidden="true"><i></i><i></i><i></i></span></span>
        </div>

        <div class="panneau" data-p="jeux">
          <div class="horloge" aria-hidden="true"><span id="hh">--</span><span class="dp">:</span><span id="mm">--</span></div>
          <div class="ligne-date" id="date"></div>
          <div class="encadre" role="status">
            <div id="message-haut">Choisis une cartouche sur l'écran du bas.</div>
            <div class="progression" aria-hidden="true"><i></i></div>
          </div>
        </div>

        <div class="panneau" data-p="partie" hidden>
          <div class="vedette">
            <small>En pause</small>
            <strong id="titre-partie"></strong>
          </div>
          <div class="infos-sauvegarde">
            <div><span>Sauvegarde du jeu</span><b id="info-sram">copiée à l'instant</b></div>
            <div><span>État de la partie</span><b id="info-etat">aucun</b></div>
            <div><span>Cloud</span><b id="info-cloud">hors ligne</b></div>
          </div>
        </div>

        <div class="panneau" data-p="salon" hidden>
          <div class="titre-lcd"><span>Salon vocal</span><small id="salon-compte"></small></div>
          <div class="vedette">
            <small id="salon-sous"></small>
            <strong id="salon-titre"></strong>
          </div>
          <div class="encadre" id="salon-message"></div>
        </div>

        <div class="panneau" data-p="coque" hidden>
          <div class="vedette">
            <small>Coque</small>
            <strong id="nom-coque">Perle</strong>
          </div>
          <div class="encadre">Touche une couleur sur l'écran du bas.</div>
        </div>

        <div class="panneau" data-p="touches" hidden>
          <div class="titre-lcd"><span>Clavier</span><small id="nom-dispo"></small></div>
          <div class="legende" id="legende"></div>
          <div class="ligne-manette" id="ligne-manette"></div>
        </div>
      </section>

      <section class="lcd bas" aria-label="Écran du bas">
        <div class="panneau" data-p="jeux">
          <div class="vues-jeux" role="tablist" aria-label="Jeux">
            <button type="button" class="vue-jeux" role="tab" data-vue="perso" aria-selected="true">Tes cartouches<small id="compte"></small></button>
            <button type="button" class="vue-jeux" role="tab" data-vue="catalogue" aria-selected="false">Catalogue<small id="compte-catalogue"></small></button>
          </div>
          <div class="apres-ajout" id="apres-ajout" role="status" hidden></div>
          <div class="grille" id="grille"></div>
          <div class="grille" id="grille-catalogue" hidden></div>
          <div class="etat-ludo" id="etat-ludo" hidden></div>
          <div class="erreur" id="erreur" role="alert"></div>
        </div>

        <div class="panneau" data-p="partie" hidden>
          <div class="choix-grille">
            <button class="choix principal large" type="button" id="reprendre">Reprendre</button>
            <button class="choix centre" type="button" id="sauver-etat">Sauver l'état</button>
            <button class="choix centre" type="button" id="charger-etat" disabled>Charger l'état</button>
            <button class="choix centre" type="button" id="plein-ecran">Plein écran</button>
            <button class="choix centre danger" type="button" id="quitter">Quitter le jeu</button>
            <button class="choix centre large" type="button" id="anciennes">Anciennes sauvegardes</button>
          </div>
          <div class="choix-liste serre" id="versions" hidden></div>
        </div>

        <div class="panneau" data-p="salon" hidden>
          <div class="actions-salon" id="actions-salon"></div>
          <div class="liste-joueurs" id="liste-joueurs"></div>
        </div>

        <div class="panneau" data-p="coque" hidden>
          <div class="coques" id="coques"></div>
          <button class="bascule" type="button" id="bascule-decor" aria-pressed="true"><span>Décor autour de la console</span><b id="etat-decor">Assorti</b></button>
        </div>

        <div class="panneau" data-p="touches" hidden>
          <div class="choix-liste serre">
            <div class="sous-titre">Clavier</div>
            <div class="paire" id="dispositions"></div>
            <div class="sous-titre">Manette</div>
            <div class="paire" id="manettes"></div>
          </div>
        </div>

        <nav class="onglets" role="tablist" aria-label="Menu">
          <button class="onglet" type="button" role="tab" data-onglet="jeux">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M2 1h6l2 2v8H2z"/><path fill="var(--lcd)" d="M3.5 2.5h4v3h-4z"/></svg>Jeux</button>
          <button class="onglet" type="button" role="tab" data-onglet="partie" hidden>
            <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3 2h2v8H3zM7 2h2v8H7z"/></svg>Partie</button>
          <button class="onglet" type="button" role="tab" data-onglet="salon">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M2 2h3v3H2zM7 2h3v3H7zM1 7h5v4H1zM6 7h5v4H6z"/></svg>Salon<i class="point" id="point-salon" hidden></i></button>
          <button class="onglet" type="button" role="tab" data-onglet="coque">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M2 1h8v4.5H2zM2 6.5h8V11H2z"/></svg>Coque</button>
          <button class="onglet" type="button" role="tab" data-onglet="touches">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 3h10v6H1z"/><path fill="var(--lcd)" d="M2.5 4.5h1v1h-1zM5.5 4.5h1v1h-1zM8.5 4.5h1v1h-1zM3.5 6.5h5v1h-5z"/></svg>Touches</button>
        </nav>
        <div class="depot-msg">Lâche les jeux pour les ajouter</div>
      </section>
    </div>
  </div>

  <div class="charniere" aria-hidden="true">
    <div></div>
    <div class="fente"></div>
    <div class="rangee"><div class="cylindre"><span class="voyants"><i class="on"></i><i></i></span></div></div>
    <div class="bord-bas"></div>
  </div>
  <button class="epaule l" data-bouton="10" type="button" aria-label="L">L</button>
  <button class="epaule r" data-bouton="11" type="button" aria-label="R">R</button>

  <div class="croix">
    <button class="h" data-bouton="4" type="button" aria-label="Haut"></button>
    <button class="g" data-bouton="6" type="button" aria-label="Gauche"></button>
    <span class="centre"></span>
    <button class="d" data-bouton="7" type="button" aria-label="Droite"></button>
    <button class="b" data-bouton="5" type="button" aria-label="Bas"></button>
  </div>
  <div class="abxy">
    <button class="x" data-bouton="9" type="button">X</button>
    <button class="y" data-bouton="1" type="button">Y</button>
    <button class="a" data-bouton="8" type="button">A</button>
    <button class="b" data-bouton="0" type="button">B</button>
  </div>
  <div class="petits">
    <button class="select" data-bouton="2" type="button" aria-label="Select"></button>
    <button class="start" data-bouton="3" type="button" aria-label="Start"></button>
    <span class="ls">SELECT</span><span class="lst">START</span>
  </div>
  <div class="menu-phys">
    <button type="button" id="bouton-menu" aria-label="Menu"></button>
    <span>MENU</span>
  </div>
  <label class="volume-phys" title="Volume">
    <span>VOL</span>
    <input type="range" id="volume" min="0" max="100" step="5" value="70" aria-label="Volume du son">
  </label>
  <div class="gravure" aria-hidden="true">Rétro</div>
</div>

<input type="file" id="fichier" accept=".nds,.gba,.gb,.gbc,.zip,.7z" multiple hidden>
<script src="console.js"></script>

</body>
</html>
