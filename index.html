<!DOCTYPE html>
<html lang="fr" data-theme="perle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Rétro · console DS</title>
<script src="config.js"></script>
<script src="discord-sdk.js"></script>
<style>
  @font-face {
    font-family: "Pixelify";
    src: url("polices/pixelify-sans-latin-400-normal.woff2") format("woff2");
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: "Pixelify";
    src: url("polices/pixelify-sans-latin-600-normal.woff2") format("woff2");
    font-weight: 600; font-display: swap;
  }

  /* ---------- Thèmes : une coque = une palette ---------- */
  :root {
    --fond: #1e1f22;
    --surface: #2b2d31;
    --surface-2: #313338;
    --texte: #f2f3f5;
    --texte-2: #b5bac1;
    --texte-3: #80848e;
    --lcd: #e4ebee;
    --lcd-2: #d2dde2;
    --encre: #1f2b33;
    --encre-2: #5b6b75;
    --vh: 100vh;

    --accent: #5865f2;
    --sur-accent: #ffffff;
    --coque: linear-gradient(170deg, #f4f5f8, #e6e8ee 55%, #dcdfe6);
    --coque-plat: #e2e5eb;
    --coque-ombre: #c3c7d0;
    --motif: linear-gradient(transparent, transparent);
    --lueur: 0 18px 50px rgba(0,0,0,.45);
    --charniere: linear-gradient(#d3d6de, #b9bdc7);
    --fente: #a9adb8;
    --cadre: #17181c;
    --bouton: #2a2c31;
    --bouton-texte: #e9ebf0;
    --bouton-ombre: #0d0e10;
    --petit: #9da1ab;
    --grave: #7d818b;
    --hp: #a3a7b1;
    --epaule: #cdd0d8;
    --epaule-texte: #5b5f69;
  }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }

  [data-theme="onyx"] {
    --accent: #d9b56a; --sur-accent: #1a1408;
    --coque: linear-gradient(160deg, #2c2d33, #141519 60%, #1d1e23);
    --coque-plat: #18191d; --coque-ombre: #000; --charniere: linear-gradient(#2a2b31, #131417); --fente: #000;
    --cadre: #050506; --bouton: #3a3b42; --bouton-texte: #d9b56a; --bouton-ombre: #000;
    --petit: #3a3b42; --grave: #8c7a52; --hp: #3a3b42; --epaule: #26272c; --epaule-texte: #d9b56a;
    --lueur: 0 0 0 1px rgba(217,181,106,.25), 0 18px 50px rgba(0,0,0,.6);
  }
  [data-theme="cerise"] {
    --accent: #e2475b; --sur-accent: #ffffff;
    --coque: linear-gradient(150deg, #e2475b, #a5162b 55%, #c42a3f);
    --coque-plat: #b41f35; --coque-ombre: #6e0d1b; --charniere: linear-gradient(#c22a3f, #8c1124); --fente: #5a0a16;
    --cadre: #160407; --bouton: #2b1216; --bouton-texte: #ffd9de; --bouton-ombre: #4a0811;
    --petit: #f2c9cf; --grave: #ffd0d6; --hp: #7a0f20; --epaule: #ce3549; --epaule-texte: #ffe3e7;
    --motif: radial-gradient(ellipse at 25% 10%, rgba(255,255,255,.35), transparent 45%);
    --lueur: 0 18px 50px rgba(120,10,30,.5);
  }
  [data-theme="glacier"] {
    --accent: #3d9be0; --sur-accent: #ffffff;
    --coque: linear-gradient(160deg, rgba(190,230,255,.8), rgba(120,180,230,.6) 60%, rgba(170,215,250,.75));
    --coque-plat: #93c4ea; --coque-ombre: rgba(60,120,180,.6); --charniere: linear-gradient(#a9d2f2, #6fa8d8); --fente: #4f86b8;
    --cadre: #0b1622; --bouton: rgba(30,70,110,.85); --bouton-texte: #e6f6ff; --bouton-ombre: rgba(10,30,50,.8);
    --petit: rgba(40,90,140,.6); --grave: #20507a; --hp: rgba(40,90,140,.55); --epaule: rgba(150,200,240,.95); --epaule-texte: #1d4d78;
    --motif: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 38%, transparent 46%),
             repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px);
    --lueur: 0 0 40px rgba(120,190,255,.3), 0 18px 50px rgba(0,0,0,.45);
  }
  [data-theme="galaxie"] {
    --accent: #8e6bea; --sur-accent: #ffffff;
    --coque: radial-gradient(ellipse at 70% 20%, #5a2f9c, transparent 55%), radial-gradient(ellipse at 15% 85%, #1f4fa0, transparent 50%), #120c26;
    --coque-plat: #1a1236; --coque-ombre: #05030c; --charniere: linear-gradient(#2e2058, #170f33); --fente: #07041a;
    --cadre: #04020a; --bouton: #2b2156; --bouton-texte: #e7dcff; --bouton-ombre: #07041a;
    --petit: #4a3a8a; --grave: #a796e8; --hp: #4a3a8a; --epaule: #2f2360; --epaule-texte: #cbbcff;
    --motif: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 33% 72%, #fff, transparent),
             radial-gradient(1.5px 1.5px at 58% 34%, #fff, transparent), radial-gradient(1px 1px at 81% 61%, #fff, transparent),
             radial-gradient(2px 2px at 90% 14%, #ffe9a8, transparent), radial-gradient(1px 1px at 22% 48%, #cfe2ff, transparent),
             radial-gradient(1px 1px at 70% 88%, #fff, transparent), radial-gradient(1.5px 1.5px at 46% 9%, #fff, transparent),
             radial-gradient(1px 1px at 8% 92%, #fff, transparent), radial-gradient(1px 1px at 95% 40%, #fff, transparent);
    --lueur: 0 0 50px rgba(110,70,220,.3), 0 18px 50px rgba(0,0,0,.55);
  }
  [data-theme="sakura"] {
    --accent: #d96585; --sur-accent: #ffffff;
    --coque: linear-gradient(160deg, #fff1f4, #f9d5de 70%, #f6c6d2);
    --coque-plat: #f6ccd7; --coque-ombre: #e3a9b8; --charniere: linear-gradient(#f4c3cf, #e2a3b4); --fente: #d996a9;
    --cadre: #2a1a20; --bouton: #8c4a5e; --bouton-texte: #fff0f4; --bouton-ombre: #5e2c3b;
    --petit: #e3a9b8; --grave: #a8657a; --hp: #e3a9b8; --epaule: #f2bccb; --epaule-texte: #8c4a5e;
    --motif: radial-gradient(circle at 12% 20%, rgba(232,120,150,.55) 0 4px, transparent 5px),
             radial-gradient(circle at 16% 24%, rgba(232,120,150,.35) 0 3px, transparent 4px),
             radial-gradient(circle at 85% 30%, rgba(232,120,150,.45) 0 5px, transparent 6px),
             radial-gradient(circle at 80% 78%, rgba(232,120,150,.4) 0 4px, transparent 5px),
             radial-gradient(circle at 20% 82%, rgba(232,120,150,.5) 0 3px, transparent 4px),
             radial-gradient(circle at 50% 6%, rgba(232,120,150,.3) 0 3px, transparent 4px);
    --lueur: 0 18px 46px rgba(180,80,110,.35);
  }
  [data-theme="or"] {
    --accent: #d4b264; --sur-accent: #1a1408;
    --coque: linear-gradient(135deg, #0d0d0f, #1c1a16 50%, #0d0d0f);
    --coque-plat: #141310; --coque-ombre: #000; --charniere: linear-gradient(#e8c877, #b8913f 50%, #8d6a24); --fente: #000;
    --cadre: #000; --bouton: linear-gradient(#f0d58c, #b8913f); --bouton-texte: #1a1408; --bouton-ombre: #5a4312;
    --petit: #b8913f; --grave: #d4b264; --hp: #6e5a2c; --epaule: linear-gradient(#e8c877, #a8822f); --epaule-texte: #1a1408;
    --motif: repeating-linear-gradient(45deg, rgba(212,178,100,.07) 0 1px, transparent 1px 12px),
             repeating-linear-gradient(-45deg, rgba(212,178,100,.07) 0 1px, transparent 1px 12px);
    --lueur: 0 0 0 2px #b8913f, 0 18px 50px rgba(0,0,0,.6);
  }
  [data-theme="neon"] {
    --accent: #00e5ff; --sur-accent: #001418;
    --coque: #0b0c10;
    --coque-plat: #0b0c10; --coque-ombre: #000; --charniere: #101218; --fente: #00e5ff;
    --cadre: #000; --bouton: #11131a; --bouton-texte: #ff3df2; --bouton-ombre: #ff3df2;
    --petit: #00e5ff; --grave: #00e5ff; --hp: #ff3df2; --epaule: #11131a; --epaule-texte: #00e5ff;
    --motif: linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px) 0 0 / 100% 14px,
             linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px) 0 0 / 14px 100%;
    --lueur: 0 0 0 1.5px #00e5ff, 0 0 22px rgba(0,229,255,.5), 0 0 60px rgba(255,61,242,.22);
  }
  [data-theme="neon"] .croix button, [data-theme="neon"] .croix .centre { box-shadow: 0 0 8px rgba(0,229,255,.5); outline: 1px solid #00e5ff; }
  [data-theme="neon"] .abxy button { outline: 1px solid #ff3df2; box-shadow: 0 0 10px rgba(255,61,242,.6); }
  [data-theme="neon"] .epaule { outline: 1px solid #00e5ff; }


  /* ---------- Page : rien d'autre que la console ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: var(--vh);
    color: var(--texte);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Géométrie de la console ----------
     Une unité --u = un pixel de l'écran DS (256 × 192 par écran).
     --aile : largeur des côtés, --haut : bord au-dessus de l'écran du haut,
     --bas : hauteur de la zone sous l'écran du bas. */
  #console {
    --aile: 140;
    --haut: 26;
    --u: min(calc((var(--vh) - 28px) / 508), calc((100vw - 24px) / 536), 2.1px);
    --bas: calc(var(--u) * 34);
    --lr: calc(var(--u) * 104);
    --x0: calc(var(--u) * var(--aile));
    --y0: calc(var(--u) * var(--haut));
    --w: calc(var(--u) * 256);
    --gy: calc(var(--y0) + var(--u) * 192);
    --by: calc(var(--y0) + var(--u) * 448);
    position: relative;
    width: calc(var(--u) * (256 + 2 * var(--aile)));
    height: calc(var(--by) + var(--bas));
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #console::before, #console::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    background: var(--motif), var(--coque);
    box-shadow: inset 0 -3px 0 var(--coque-ombre), inset 0 2px 0 rgba(255,255,255,.22), var(--lueur);
    transition: background .4s, box-shadow .4s;
  }
  #console::before {
    top: 0; height: calc(var(--gy) + var(--u) * 16);
    border-radius: calc(var(--u) * 22) calc(var(--u) * 22) calc(var(--u) * 12) calc(var(--u) * 12);
  }
  #console::after {
    top: calc(var(--gy) + var(--u) * 18); bottom: 0;
    border-radius: calc(var(--u) * 10) calc(var(--u) * 10) calc(var(--u) * 26) calc(var(--u) * 26);
  }

  /* Écrans */
  .zone-ecrans { position: absolute; left: var(--x0); top: var(--y0); width: var(--w); height: calc(var(--u) * 448); z-index: 1; }
  .vitre-haut, .vitre-bas { position: absolute; background: var(--cadre); z-index: -1; }
  .vitre-haut {
    left: calc(var(--u) * -12); right: calc(var(--u) * -12);
    top: calc(var(--u) * -10); height: calc(var(--u) * 210);
    border-radius: calc(var(--u) * 7);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .vitre-haut::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.07), transparent 38%);
  }
  .vitre-bas {
    left: calc(var(--u) * -5); right: calc(var(--u) * -5);
    top: calc(var(--u) * 251); bottom: calc(var(--u) * -5);
    border-radius: calc(var(--u) * 5);
  }
  /* Seuls les deux écrans du jeu sont visibles : l'espace entre eux laisse voir la coque. */
  #game {
    position: absolute; inset: 0; background: #000;
    clip-path: polygon(0 0, 100% 0, 100% 42.857%, 0 42.857%, 0 57.143%, 100% 57.143%, 100% 100%, 0 100%);
  }
  #game:focus { outline: none; }

  /* Charnière : bas de la moitié haute, fente, cylindre avec voyants, haut de la moitié basse */
  .charniere {
    position: absolute; left: 0; right: 0;
    top: var(--gy); height: calc(var(--u) * 64);
    display: grid;
    grid-template-rows: calc(var(--u) * 16) calc(var(--u) * 2) calc(var(--u) * 32) 1fr;
    z-index: 5; pointer-events: none;
  }
  .charniere .rangee { padding: calc(var(--u) * 3) calc(var(--lr) + var(--u) * 5); }
  .charniere .fente { background: var(--fente); margin: 0 calc(var(--u) * 6); border-radius: 99px; transition: background .4s; }
  .charniere > * { transition: background .4s; }
  .cylindre {
    position: relative; height: 100%; border-radius: 999px;
    background: linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,0) 45%, rgba(0,0,0,.24)), var(--charniere);
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .voyants { position: absolute; right: 7%; top: 50%; transform: translateY(-50%); display: flex; gap: calc(var(--u) * 5); }
  .voyants i { width: max(5px, calc(var(--u) * 4)); aspect-ratio: 1; border-radius: 50%; background: rgba(0,0,0,.25); }
  .voyants i.on { background: #3be07a; box-shadow: 0 0 6px #3be07a; }
  body.chargement .voyants i.on { animation: clignote .9s step-end infinite; }

  /* Haut-parleurs */
  .hp { position: absolute; top: calc(var(--y0) + var(--u) * 96); transform: translate(-50%, -50%); display: grid; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 4.5); z-index: 1; }
  .hp i { width: max(4px, calc(var(--u) * 3.6)); aspect-ratio: 1; border-radius: 50%; background: var(--hp); box-shadow: inset 0 1px 1px rgba(0,0,0,.35); }
  .hp.g { left: calc(var(--x0) / 2); }
  .hp.d { left: calc(100% - var(--x0) / 2); }

  /* Boutons physiques */
  .croix, .abxy, .petits, .menu-phys, .gravure { position: absolute; z-index: 2; }
  .croix { width: calc(var(--u) * 78); aspect-ratio: 1; left: calc(var(--x0) / 2); top: calc(var(--gy) + var(--u) * 134); transform: translate(-50%, -50%); }
  .abxy { width: calc(var(--u) * 88); aspect-ratio: 1; left: calc(100% - var(--x0) / 2); top: calc(var(--gy) + var(--u) * 124); transform: translate(-50%, -50%); }
  .petits { width: calc(var(--u) * 70); height: calc(var(--u) * 26); left: calc(100% - var(--x0) / 2); top: calc(var(--gy) + var(--u) * 186); transform: translateX(-50%); }
  .menu-phys { left: calc(var(--x0) / 2); top: calc(var(--gy) + var(--u) * 196); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 3); }
  .gravure { left: 50%; top: calc(var(--by) + var(--u) * 13); transform: translateX(-50%); font: 600 max(10px, calc(var(--u) * 10))/1 "Pixelify", system-ui, sans-serif; color: var(--grave); opacity: .8; letter-spacing: .5px; }

  .croix button, .abxy button, .petits button, .epaule, .menu-phys button {
    position: absolute; border: none; padding: 0; cursor: pointer;
    font: 600 12px/1 system-ui, sans-serif; color: var(--bouton-texte);
    -webkit-tap-highlight-color: transparent;
    transition: transform .05s, filter .05s;
  }
  .croix button, .croix .centre { background: var(--bouton); width: 34%; height: 34%; box-shadow: 0 2px 0 var(--bouton-ombre); }
  .croix .h { left: 33%; top: 0; border-radius: 6px 6px 0 0; }
  .croix .b { left: 33%; bottom: 0; border-radius: 0 0 6px 6px; }
  .croix .g { left: 0; top: 33%; border-radius: 6px 0 0 6px; }
  .croix .d { right: 0; top: 33%; border-radius: 0 6px 6px 0; }
  .croix .centre { position: absolute; left: 33%; top: 33%; box-shadow: none; }
  .croix .centre::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(0,0,0,.35), rgba(255,255,255,.06)); }
  .croix button::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border: 5px solid transparent; opacity: .35; transform: translate(-50%, -50%); }
  .croix .h::after { border-bottom-color: var(--bouton-texte); margin-top: -3px; }
  .croix .b::after { border-top-color: var(--bouton-texte); margin-top: 3px; }
  .croix .g::after { border-right-color: var(--bouton-texte); margin-left: -3px; }
  .croix .d::after { border-left-color: var(--bouton-texte); margin-left: 3px; }
  .abxy button {
    width: 34%; height: 34%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), transparent 55%), var(--bouton);
    box-shadow: 0 3px 0 var(--bouton-ombre), 0 4px 8px rgba(0,0,0,.25);
    font-size: max(11px, calc(var(--u) * 10));
  }
  .abxy .x { left: 33%; top: 0; } .abxy .b { left: 33%; bottom: 0; }
  .abxy .y { left: 0; top: 33%; } .abxy .a { right: 0; top: 33%; }
  .petits button { width: 44%; height: max(11px, calc(var(--u) * 9)); top: 0; border-radius: 99px; background: var(--petit); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .petits .select { left: 0; } .petits .start { right: 0; }
  .petits span, .menu-phys span { position: absolute; width: 44%; text-align: center; top: calc(max(11px, calc(var(--u) * 9)) + 4px); font: 600 max(8px, calc(var(--u) * 7))/1 system-ui, sans-serif; letter-spacing: .3px; color: var(--grave); }
  .petits .ls { left: 0; } .petits .lst { right: 0; }
  .menu-phys button {
    position: relative; width: max(18px, calc(var(--u) * 14)); aspect-ratio: 1; border-radius: 50%;
    background: var(--petit); box-shadow: inset 0 -2px 0 rgba(0,0,0,.22), 0 0 0 max(2px, calc(var(--u) * 2)) var(--coque-ombre);
  }
  .menu-phys span { position: static; width: auto; }
  .epaule {
    top: calc(var(--gy) + var(--u) * 18); height: calc(var(--u) * 32);
    width: var(--lr);
    background: var(--epaule); color: var(--epaule-texte);
    z-index: 6; font-size: max(11px, calc(var(--u) * 9));
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), inset 0 2px 0 rgba(255,255,255,.25);
  }
  .epaule.l { left: 0; border-radius: calc(var(--u) * 12) calc(var(--u) * 6) calc(var(--u) * 4) 0; padding-left: calc(var(--u) * 12); text-align: left; }
  .epaule.r { right: 0; border-radius: calc(var(--u) * 6) calc(var(--u) * 12) 0 calc(var(--u) * 4); padding-right: calc(var(--u) * 12); text-align: right; }
  #console button.appuye { filter: brightness(1.45); transform: translateY(2px); }
  .abxy button.appuye, .croix button.appuye { box-shadow: 0 0 0 var(--bouton-ombre); }
  .croix button.appuye, .abxy button.appuye, .menu-phys button.appuye { transform: translateY(2px); }

  /* ---------- Menu système, dessiné dans les deux écrans ---------- */
  #menu { position: absolute; inset: 0; z-index: 3; transition: opacity .3s; }
  #menu.parti { opacity: 0; pointer-events: none; }
  .lcd {
    position: absolute; left: 0; right: 0;
    height: calc(var(--u) * 192);
    overflow: hidden;
    color: var(--encre);
    background:
      linear-gradient(rgba(31,43,51,.035) 1px, transparent 1px) 0 0 / 100% calc(var(--u) * 2),
      linear-gradient(180deg, var(--lcd), var(--lcd-2));
    font: 400 max(11px, calc(var(--u) * 8.5))/1.25 "Pixelify", system-ui, sans-serif;
    font-variant-ligatures: none;
    display: flex; flex-direction: column;
  }
  .lcd.haut { top: 0; }
  .lcd.bas { bottom: 0; }
  .lcd::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
  #menu.flash .lcd::after { animation: flash .45s ease-out; }
  [hidden] { display: none !important; }

  .bandeau {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    height: calc(var(--u) * 17); padding: 0 calc(var(--u) * 8);
    background: var(--accent); color: var(--sur-accent);
    font-weight: 600; transition: background .4s;
  }
  .bandeau .signal { display: inline-flex; align-items: center; gap: calc(var(--u) * 4); }
  .barres { display: inline-flex; align-items: flex-end; gap: 1px; height: calc(var(--u) * 8); }
  .barres i { width: calc(var(--u) * 2); background: currentColor; }
  .barres i:nth-child(1) { height: 40%; } .barres i:nth-child(2) { height: 70%; } .barres i:nth-child(3) { height: 100%; }

          <div class="ligne-manette" id="ligne-manette"></div>

      <section class="lcd bas" aria-label="Écran du bas">
        <div class="panneau" data-p="jeux">
          <div class="titre-lcd"><span>Tes cartouches</span><small id="compte"></small></div>

        <div class="panneau" data-p="partie" hidden>

  <button class="epaule r" data-bouton="11" type="button" aria-label="R">R</button>

<input type="file" id="fichier" accept=".nds,.zip,.7z" hidden>
<script>
  const CONFIG = window.DS_RETRO_CONFIG || {};
  const DANS_DISCORD = new URLSearchParams(location.search).has("frame_id");
  const CDN = DANS_DISCORD ? "/.proxy/emulatorjs/stable/data/" : "https://cdn.emulatorjs.org/stable/data/";
  let discordPret = Promise.resolve();

  if (DANS_DISCORD) {
    document.getElementById("lieu").textContent = "Discord";
    if (window.DiscordEmbedded && CONFIG.discordApplicationId) {
      DiscordEmbedded.patchUrlMappings(
        [{ prefix: "/emulatorjs", target: "cdn.emulatorjs.org" }],
        { patchFetch: true, patchXhr: true, patchWebSocket: true, patchSrcAttributes: true }
      );
      const sdk = new DiscordEmbedded.DiscordSDK(CONFIG.discordApplicationId);
      window.discordSdk = sdk;
      discordPret = sdk.ready().catch(() => {});
    }
  }
  const EXTENSIONS = [".nds", ".zip", ".7z"];
  const $ = id => document.getElementById(id);
  const lire = (cle, defaut) => { try { return localStorage.getItem(cle) || defaut; } catch (e) { return defaut; } };
  const ecrire = (cle, val) => { try { localStorage.setItem(cle, val); } catch (e) {} };

  // ---------- État général ----------
  let jeuActif = false;     // une cartouche est insérée (chargement ou jeu)
  let jeuDemarre = false;   // l'émulateur tourne
  let menuOuvert = false;   // menu affiché pendant une partie (jeu en pause)
  let cartoucheId = null;
  let nomJeu = "";

  // ---------- Touches du clavier ----------
  const BOUTONS = [
    { id: 4, nom: "Haut" }, { id: 5, nom: "Bas" }, { id: 6, nom: "Gauche" }, { id: 7, nom: "Droite" },
    { id: 8, nom: "A" }, { id: 0, nom: "B" }, { id: 9, nom: "X" }, { id: 1, nom: "Y" },
    { id: 10, nom: "L" }, { id: 11, nom: "R" }, { id: 3, nom: "Start" }, { id: 2, nom: "Select" }
  ];
  const PRESETS = {
    zqsd: {
      gameId: 101,
      titre: "ZQSD + JKUI",
      desc: "Clavier AZERTY",
      touches: { 4: "z", 5: "s", 6: "q", 7: "d", 8: "k", 0: "j", 9: "i", 1: "u", 10: "a", 11: "e", 3: "enter", 2: "space" },
      noms: { z: "Z", s: "S", q: "Q", d: "D", k: "K", j: "J", i: "I", u: "U", a: "A", e: "E", enter: "Entrée", space: "Espace" }
    },
    fleches: {
      gameId: 102,
      titre: "Flèches",
      desc: "Flèches + lettres",
      touches: { 4: "up arrow", 5: "down arrow", 6: "left arrow", 7: "right arrow", 8: "x", 0: "w", 9: "s", 1: "q", 10: "a", 11: "z", 3: "enter", 2: "shift" },
      noms: { "up arrow": "↑", "down arrow": "↓", "left arrow": "←", "right arrow": "→", x: "X", w: "W", s: "S", q: "Q", a: "A", z: "Z", enter: "Entrée", shift: "Maj" }
    }
  };
  // Manette standard : BUTTON_1 = bas, BUTTON_2 = droite, BUTTON_3 = gauche, BUTTON_4 = haut
  const MANETTES = {
    ds: {
      titre: "Positions DS",
      desc: "A à droite, B en bas",
      boutons: { 8: "BUTTON_2", 0: "BUTTON_1", 9: "BUTTON_4", 1: "BUTTON_3" },
      valider: 1, retour: 0,
      ligne: "Manette, positions DS : A à droite, B en bas, comme sur la console."
    },
    xbox: {
      titre: "Lettres Xbox",
      desc: "A = A, B = B",
      boutons: { 8: "BUTTON_1", 0: "BUTTON_2", 9: "BUTTON_3", 1: "BUTTON_4" },
      valider: 0, retour: 1,
      ligne: "Manette, lettres Xbox : le bouton A de ta manette fait A."
    }
  };
  const MANETTE_COMMUNS = {
    2: "SELECT", 3: "START", 4: "DPAD_UP", 5: "DPAD_DOWN", 6: "DPAD_LEFT", 7: "DPAD_RIGHT",
    10: "LEFT_TOP_SHOULDER", 11: "RIGHT_TOP_SHOULDER"
  };

  let presetChoisi = lire("ds-retro-preset", "zqsd");
  if (!PRESETS[presetChoisi]) presetChoisi = "zqsd";
  let manetteChoisie = lire("ds-retro-manette", "ds");
  if (!MANETTES[manetteChoisie]) manetteChoisie = "ds";

  function afficherTouches() {
    const p = PRESETS[presetChoisi];
    $("nom-dispo").textContent = p.titre;
    const el = $("legende");
    el.innerHTML = "";
    BOUTONS.forEach(b => {
      const ligne = document.createElement("div");
      const nom = document.createElement("span");
      nom.textContent = b.nom;
      const touche = document.createElement("kbd");
      touche.textContent = p.noms[p.touches[b.id]];
      ligne.append(nom, touche);
      el.appendChild(ligne);
    });
    $("ligne-manette").textContent = MANETTES[manetteChoisie].ligne + " Menu : bouton central, ou Select + Start.";

    const remplir = (conteneur, liste, choisi, surChoix) => {
      conteneur.innerHTML = "";
      Object.entries(liste).forEach(([cle, item]) => {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "choix";
        btn.setAttribute("aria-pressed", String(cle === choisi));
        const t = document.createElement("strong"); t.textContent = item.titre;
        const d = document.createElement("span"); d.textContent = item.desc;
        btn.append(t, d);
        btn.addEventListener("click", () => { surChoix(cle); afficherTouches(); btnFocus(conteneur, cle, liste); });
        conteneur.appendChild(btn);
      });
    };
    remplir($("dispositions"), PRESETS, presetChoisi, cle => { presetChoisi = cle; ecrire("ds-retro-preset", cle); });
    remplir($("manettes"), MANETTES, manetteChoisie, cle => { manetteChoisie = cle; ecrire("ds-retro-manette", cle); });
  }
  function btnFocus(conteneur, cle, liste) {
    const i = Object.keys(liste).indexOf(cle);
    const b = conteneur.children[i];
    if (b) b.focus({ preventScroll: true });
  }
  afficherTouches();

  function construireControles() {
    const p = PRESETS[presetChoisi];
    const m = MANETTES[manetteChoisie];
    const joueur1 = {};
    for (let i = 0; i < 30; i++) joueur1[i] = { value: "" };
    Object.entries(MANETTE_COMMUNS).forEach(([id, bouton]) => { joueur1[id].value2 = bouton; });
    Object.entries(m.boutons).forEach(([id, bouton]) => { joueur1[id].value2 = bouton; });
    Object.entries(p.touches).forEach(([id, touche]) => { joueur1[id].value = touche; });
    return { 0: joueur1, 1: {}, 2: {}, 3: {} };
  }

  // ---------- Clavier et boutons de la console → émulateur ----------
  const NOMS_VERS_CODES = {
    "up arrow": 38, "down arrow": 40, "left arrow": 37, "right arrow": 39,
    enter: 13, space: 32, shift: 16
  };
  function codesDuPreset() {
    const codes = new Set([32, 37, 38, 39, 40]);
    Object.values(PRESETS[presetChoisi].touches).forEach(t => {
      codes.add(NOMS_VERS_CODES[t] || t.toUpperCase().charCodeAt(0));
    });
    return codes;
  }
  let codesJeu = codesDuPreset();

  function focusJeu() {
    if (menuOuvert) return;
    const g = $("game");
    if (g && document.activeElement !== g && !g.contains(document.activeElement)) {
      g.focus({ preventScroll: true });
    }
  }

  function gererClavier(e) {
    if (!jeuActif || menuOuvert) return;
    if (e.key === "Escape" || /^F\d+$/.test(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;
    const g = $("game");
    const dedans = g.contains(e.target);
    if (dedans) {
      if (codesJeu.has(e.keyCode)) e.preventDefault();
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    focusJeu();
    const copie = new KeyboardEvent(e.type, {
      key: e.key, code: e.code, repeat: e.repeat, bubbles: true, cancelable: true,
      shiftKey: e.shiftKey
    });
    Object.defineProperty(copie, "keyCode", { get: () => e.keyCode });
    Object.defineProperty(copie, "which", { get: () => e.keyCode });
    g.dispatchEvent(copie);
  }
  window.addEventListener("keydown", gererClavier, true);
  window.addEventListener("keyup", gererClavier, true);
  window.addEventListener("keydown", e => {
    if (e.key === "Escape" && jeuDemarre) { e.preventDefault(); menuOuvert ? fermerPause() : ouvrirPause(); return; }
    if (!menuVisible()) return;
    const fleches = { ArrowUp: "haut", ArrowDown: "bas", ArrowLeft: "gauche", ArrowRight: "droite" };
    if (fleches[e.key]) { e.preventDefault(); naviguer(fleches[e.key]); }
  });

  $("console").addEventListener("pointerdown", e => {
    document.body.classList.remove("nav-manette");
    if (jeuActif && !menuOuvert && !e.target.closest("button")) setTimeout(focusJeu, 0);
  });
  document.addEventListener("fullscreenchange", () => {
    $("plein-ecran").textContent = document.fullscreenElement ? "Quitter le plein écran" : "Plein écran";
    setTimeout(focusJeu, 50);
  });
  window.addEventListener("focus", () => { if (jeuActif) setTimeout(focusJeu, 50); });

  function envoyerTouche(type, idBouton) {
    if (menuOuvert) return;
    const nomTouche = PRESETS[presetChoisi].touches[idBouton];
    if (!nomTouche) return;
    const code = NOMS_VERS_CODES[nomTouche] || nomTouche.toUpperCase().charCodeAt(0);
    const g = $("game");
    const ev = new KeyboardEvent(type, { bubbles: true, cancelable: true });
    Object.defineProperty(ev, "keyCode", { get: () => code });
    Object.defineProperty(ev, "which", { get: () => code });
    g.dispatchEvent(ev);
  }

  // Quand le menu est affiché, la croix et A/B de la console servent à s'y déplacer.
  const NAV_CONSOLE = { 4: "haut", 5: "bas", 6: "gauche", 7: "droite", 10: "onglet-", 11: "onglet+", 8: "valider", 0: "retour", 3: "valider" };

  document.querySelectorAll("#console [data-bouton]").forEach(btn => {
    const id = Number(btn.dataset.bouton);
    let actif = false;
    const appuyer = e => {
      e.preventDefault();
      if (actif) return;
      actif = true;
      btn.classList.add("appuye");
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
      if (menuVisible()) { naviguer(NAV_CONSOLE[id]); return; }
      envoyerTouche("keydown", id);
    };
    const relacher = () => {
      if (!actif) return;
      actif = false;
      btn.classList.remove("appuye");
      envoyerTouche("keyup", id);
      if (jeuActif) focusJeu();
    };
    btn.addEventListener("pointerdown", appuyer);
    btn.addEventListener("pointerup", relacher);
    btn.addEventListener("pointercancel", relacher);
    btn.addEventListener("lostpointercapture", relacher);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });

  // ---------- Menu système (onglets) ----------
  let ongletActif = "jeux";
  const menuVisible = () => !jeuDemarre ? !jeuActif : menuOuvert;
  function ongletsDisponibles() {
    return [...document.querySelectorAll(".onglet")].filter(o => !o.hidden).map(o => o.dataset.onglet);
  }
  function afficherOnglet(nom) {
    ongletActif = nom;
    $("menu").dataset.onglet = nom;
    document.querySelectorAll("#menu .panneau").forEach(p => { p.hidden = p.dataset.p !== nom; });
    document.querySelectorAll(".onglet").forEach(o => o.setAttribute("aria-selected", String(o.dataset.onglet === nom)));
    if (nom === "partie") majInfosPartie();
  }
  document.querySelectorAll(".onglet").forEach(o => o.addEventListener("click", () => afficherOnglet(o.dataset.onglet)));
  afficherOnglet("jeux");

  $("bouton-menu").addEventListener("pointerdown", e => {
    e.preventDefault();
    const b = e.currentTarget;
    b.classList.add("appuye");
    setTimeout(() => b.classList.remove("appuye"), 120);
    if (jeuDemarre) menuOuvert ? fermerPause() : ouvrirPause();
    else if (!jeuActif) afficherOnglet("jeux");
  });

  function ouvrirPause() {
    if (!jeuDemarre || menuOuvert) return;
    menuOuvert = true;
    try { window.EJS_emulator.pause(); } catch (e) {}
    sauverSram();
    const m = $("menu");
    m.style.display = "";
    m.classList.remove("parti", "flash");
    afficherOnglet("partie");
    $("quitter").classList.remove("arme");
    $("quitter").textContent = "Quitter le jeu";
    setTimeout(() => $("reprendre").focus({ preventScroll: true }), 30);
  }
  function fermerPause() {
    if (!menuOuvert) return;
    menuOuvert = false;
    $("menu").classList.add("parti");
    setTimeout(() => { if (!menuOuvert) $("menu").style.display = "none"; }, 300);
    try { window.EJS_emulator.play(); } catch (e) {}
    codesJeu = codesDuPreset();
    setTimeout(focusJeu, 30);
  }
  $("reprendre").addEventListener("click", fermerPause);

  $("plein-ecran").addEventListener("click", () => {
    const el = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
    const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
    if (p && p.catch) p.catch(() => {});
  });

  let minuteurQuitter = null;
  $("quitter").addEventListener("click", async () => {
    const b = $("quitter");
    if (!b.classList.contains("arme")) {
      b.classList.add("arme");
      b.textContent = "Touche encore pour quitter";
      clearTimeout(minuteurQuitter);
      minuteurQuitter = setTimeout(() => { b.classList.remove("arme"); b.textContent = "Quitter le jeu"; }, 3500);
      return;
    }
    b.textContent = "Sauvegarde…";
    await sauverSram();
    location.reload();
  });

  // ---------- Coques et décor ----------
  const THEMES = [
    { id: "perle",   nom: "Perle",   haut: "#eef0f4", bas: "#dfe2e8" },
    { id: "onyx",    nom: "Onyx",    haut: "linear-gradient(135deg,#2c2d33,#141519)", bas: "#1a1b20" },
    { id: "cerise",  nom: "Cerise",  haut: "linear-gradient(135deg,#e2475b,#a5162b)", bas: "#b81f35" },
    { id: "glacier", nom: "Glacier", haut: "linear-gradient(135deg,#bfe6ff,#78b4e6)", bas: "#93c4ea" },
    { id: "galaxie", nom: "Galaxie", haut: "radial-gradient(circle at 70% 30%,#7a45d0,#120c26 75%)", bas: "#1a1236" },
    { id: "sakura",  nom: "Sakura",  haut: "linear-gradient(135deg,#fff1f4,#f6c6d2)", bas: "#f6ccd7" },
    { id: "or",      nom: "Or",      haut: "#121110", bas: "linear-gradient(#f0d58c,#b8913f)" },
    { id: "neon",    nom: "Néon",    haut: "#0b0c10", bas: "conic-gradient(#00e5ff,#ff3df2,#00e5ff)" },
  ];
  function appliquerTheme(id) {
    const theme = THEMES.find(t => t.id === id) || THEMES[0];
    document.documentElement.dataset.theme = theme.id;
    ecrire("ds-retro-theme", theme.id);
    $("nom-coque").textContent = theme.nom;
    document.querySelectorAll(".coque-choix").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.theme === theme.id)));
    window.EJS_color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  }
  THEMES.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "coque-choix"; b.dataset.theme = t.id;
    const mini = document.createElement("span");
    mini.className = "mini"; mini.setAttribute("aria-hidden", "true");
    const i1 = document.createElement("i"); i1.style.background = t.haut;
    const i2 = document.createElement("i"); i2.style.background = t.bas;
    mini.append(i1, i2);
    const nom = document.createElement("span"); nom.textContent = t.nom;
    b.append(mini, nom);
    b.addEventListener("click", () => appliquerTheme(t.id));
    $("coques").appendChild(b);
  });
  appliquerTheme(lire("ds-retro-theme", "perle"));

  function appliquerDecor(avec) {
    document.documentElement.classList.toggle("sans-decor", !avec);
    $("bascule-decor").setAttribute("aria-pressed", String(avec));
    $("etat-decor").textContent = avec ? "Assorti" : "Sobre";
    ecrire("ds-retro-decor", avec ? "assorti" : "sobre");
  }
  $("bascule-decor").addEventListener("click", () => appliquerDecor(document.documentElement.classList.contains("sans-decor")));
  appliquerDecor(lire("ds-retro-decor", "assorti") === "assorti");

  // ---------- Horloge ----------
  const formatDate = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  function majHorloge() {
    const d = new Date();
    $("hh").textContent = String(d.getHours()).padStart(2, "0");
    $("mm").textContent = String(d.getMinutes()).padStart(2, "0");
    $("date").textContent = formatDate.format(d);
  }
  majHorloge();
  setInterval(majHorloge, 5000);

  // ---------- Stockage local (IndexedDB) : cartouches, sauvegardes, états ----------
  let bdPromesse = null;
  function bd() {
    if (!bdPromesse) bdPromesse = new Promise((ok, ko) => {
      const r = indexedDB.open("ds-retro", 2);
      r.onupgradeneeded = () => {
        const base = r.result;
        ["cartouches", "sauvegardes", "etats"].forEach(nom => {
          if (!base.objectStoreNames.contains(nom)) base.createObjectStore(nom, { keyPath: "id" });
        });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
    });
    return bdPromesse;
  }
  async function magasin(nom, mode, action) {
    const base = await bd();
    return new Promise((ok, ko) => {
      const t = base.transaction(nom, mode);
      const req = action(t.objectStore(nom));
      t.oncomplete = () => ok(req ? req.result : undefined);
      t.onerror = () => ko(t.error);
      t.onabort = () => ko(t.error);
    });
  }
  const listerCartouches = () => magasin("cartouches", "readonly", s => s.getAll()).catch(() => []);
  const lireDans = (nom, id) => magasin(nom, "readonly", s => s.get(id));
  const ecrireDans = (nom, objet) => magasin(nom, "readwrite", s => s.put(objet));
  const retirerCartouche = id => magasin("cartouches", "readwrite", s => s.delete(id));

  function nomLisible(nomFichier) {
    return nomFichier.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim() || nomFichier;
  }
  function initiales(nom) {
    const mots = nom.split(/[\s\-.]+/).filter(Boolean);
    if (mots.length >= 2) return (mots[0][0] + mots[1][0]).toUpperCase();
    return nom.slice(0, 2).toUpperCase();
  }
  function teinte(texte) {
    let h = 0;
    for (const c of texte) h = (h * 31 + c.charCodeAt(0)) % 360;
    return h;
  }

  async function afficherCartouches() {
    const liste = (await listerCartouches()).sort((a, b) => (b.joue || 0) - (a.joue || 0));
    const grille = $("grille");
    grille.innerHTML = "";

    const ajouter = document.createElement("button");
    ajouter.type = "button"; ajouter.className = "ajouter";
    ajouter.innerHTML = '<span class="plus" aria-hidden="true">+</span><span>Ajouter un jeu</span>';
    ajouter.addEventListener("click", () => $("fichier").click());
    grille.appendChild(ajouter);

    liste.forEach(c => {
      const nom = nomLisible(c.nom);
      const emplacement = document.createElement("div");
      emplacement.className = "emplacement";
      const cart = document.createElement("button");
      cart.type = "button"; cart.className = "cart";
      cart.dataset.id = c.id;
      cart.style.setProperty("--teinte", teinte(nom));
      cart.setAttribute("aria-label", "Jouer à " + nom);
      const etiquette = document.createElement("span");
      etiquette.className = "etiquette"; etiquette.textContent = initiales(nom);
      const titre = document.createElement("span");
      titre.className = "nom"; titre.textContent = nom;
      cart.append(etiquette, titre);
      cart.addEventListener("click", async () => {
        try {
          const complet = await lireDans("cartouches", c.id);
          if (!complet || !complet.blob) throw new Error("absent");
          complet.joue = Date.now();
          ecrireDans("cartouches", complet).catch(() => {});
          inserer(cart, complet.blob, c.nom, c.id);
        } catch (e) {
          $("erreur").textContent = "Cette cartouche n'est plus sur l'appareil. Ajoute à nouveau le fichier.";
        }
      });
      const retirer = document.createElement("button");
      retirer.type = "button"; retirer.className = "retirer";
      retirer.textContent = "×";
      retirer.setAttribute("aria-label", "Retirer " + nom + " de la liste");
      retirer.addEventListener("click", async e => {
        e.stopPropagation();
        await retirerCartouche(c.id).catch(() => {});
        afficherCartouches();
      });
      emplacement.append(cart, retirer);
      grille.appendChild(emplacement);
    });

    if (!liste.length) {
      const vide = document.createElement("div");
      vide.className = "vide";
      vide.innerHTML = "<p>Choisis un fichier <b>.nds</b> sur ton appareil. Il reste chez toi, rien n'est envoyé.</p><p>Pas de jeu ? Cherche « DS homebrew » sur itch.io.</p>";
      grille.appendChild(vide);
      $("compte").textContent = "";
    } else {
      $("compte").textContent = liste.length === 1 ? "1 jeu" : liste.length + " jeux";
    }
  }
  afficherCartouches();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  async function ajouterFichier(fichier) {
    $("erreur").textContent = "";
    const nom = fichier.name.toLowerCase();
    if (!EXTENSIONS.some(ext => nom.endsWith(ext))) {
      $("erreur").textContent = "Ce fichier n'est pas un jeu DS. Choisis un .nds, ou un .zip / .7z qui en contient un.";
      return;
    }
    const id = fichier.name + "|" + fichier.size;
    try {
      const ancien = await lireDans("cartouches", id).catch(() => null);
      await ecrireDans("cartouches", { id, nom: fichier.name, taille: fichier.size, ajoute: ancien ? ancien.ajoute : Date.now(), joue: Date.now(), blob: fichier });
    } catch (e) {
      // Plus de place sur l'appareil : on lance quand même, sans garder la cartouche.
    }
    await afficherCartouches();
    const cart = document.querySelector(`.cart[data-id="${CSS.escape(id)}"]`);
    inserer(cart, fichier, fichier.name, id);
  }

  $("fichier").addEventListener("change", () => {
    if ($("fichier").files.length) ajouterFichier($("fichier").files[0]);
    $("fichier").value = "";
  });

  let profondeur = 0;
  window.addEventListener("dragenter", e => { if (jeuActif) return; e.preventDefault(); profondeur++; afficherOnglet("jeux"); document.body.classList.add("depot"); });
  window.addEventListener("dragover", e => { if (!jeuActif) e.preventDefault(); });
  window.addEventListener("dragleave", () => { if (--profondeur <= 0) { profondeur = 0; document.body.classList.remove("depot"); } });
  window.addEventListener("drop", e => {
    e.preventDefault(); profondeur = 0; document.body.classList.remove("depot");
    if (!jeuActif && e.dataTransfer.files.length) ajouterFichier(e.dataTransfer.files[0]);
  });

  // ---------- Sauvegardes ----------
  // 1) La sauvegarde faite dans le jeu (comme sur une vraie DS) : copiée ici toutes les 20 s,
  //    à chaque pause et en quittant, puis remise en place au prochain lancement.
  // 2) Les états : une photo instantanée de la partie, à sauver et recharger depuis le menu.
  let derniereEmpreinte = "";
  let derniereCopie = 0;
  function empreinte(octets) {
    let h = 2166136261;
    for (let i = 0; i < octets.length; i += 7) h = Math.imul(h ^ octets[i], 16777619);
    return octets.length + ":" + (h >>> 0);
  }
  async function sauverSram() {
    if (!jeuDemarre || !cartoucheId) return;
    try {
      const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
      const donnees = gm && gm.getSaveFile();
      if (!donnees || !donnees.length) return;
      const e = empreinte(donnees);
      if (e !== derniereEmpreinte) {
        await ecrireDans("sauvegardes", { id: cartoucheId, donnees: new Uint8Array(donnees), maj: Date.now() });
        derniereEmpreinte = e;
      }
      derniereCopie = Date.now();
    } catch (err) {}
  }
  async function restaurerSram() {
    if (!cartoucheId) return;
    try {
      const s = await lireDans("sauvegardes", cartoucheId);
      if (!s || !s.donnees) return;
      const gm = window.EJS_emulator.gameManager;
      const chemin = gm.getSaveFilePath();
      gm.FS.writeFile(chemin, s.donnees);
      gm.loadSaveFiles();
      derniereEmpreinte = empreinte(s.donnees);
    } catch (err) {}
  }
  setInterval(sauverSram, 20000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) sauverSram(); });
  window.addEventListener("pagehide", () => { sauverSram(); });

  function ilYA(t) {
    if (!t) return "aucun";
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return "à l'instant";
    const m = Math.round(s / 60);
    if (m < 60) return "il y a " + m + " min";
    return new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(t);
  }
  async function majInfosPartie() {
    $("titre-partie").textContent = nomJeu;
    $("info-sram").textContent = derniereCopie ? "copiée " + ilYA(derniereCopie) : "pas encore faite";
    const etat = cartoucheId ? await lireDans("etats", cartoucheId).catch(() => null) : null;
    $("info-etat").textContent = etat ? ilYA(etat.maj) : "aucun";
    $("charger-etat").disabled = !etat;
  }
  $("sauver-etat").addEventListener("click", async () => {
    const b = $("sauver-etat");
    try {
      const etat = window.EJS_emulator.gameManager.getState();
      await ecrireDans("etats", { id: cartoucheId, etat: new Uint8Array(etat), maj: Date.now() });
      b.textContent = "État sauvé";
    } catch (e) {
      b.textContent = "Échec, réessaie";
    }
    setTimeout(() => { b.textContent = "Sauver l'état"; }, 1600);
    majInfosPartie();
  });
  $("charger-etat").addEventListener("click", async () => {
    try {
      const e = await lireDans("etats", cartoucheId);
      if (!e) return;
      window.EJS_emulator.gameManager.loadState(e.etat);
      fermerPause();
    } catch (err) {
      $("charger-etat").textContent = "Échec, réessaie";
      setTimeout(() => { $("charger-etat").textContent = "Charger l'état"; }, 1600);
    }
  });

  // ---------- Insertion de la cartouche puis démarrage ----------
  const mouvementReduit = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function inserer(cart, blob, nomFichier, id) {
    if (jeuActif) return;
    jeuActif = true;
    cartoucheId = id || null;
    nomJeu = nomLisible(nomFichier);
    afficherOnglet("jeux");
    $("message-haut").textContent = "Lancement de " + nomJeu + "…";
    document.body.classList.add("chargement");

    if (cart && !mouvementReduit) {
      const zone = document.querySelector(".lcd.bas").getBoundingClientRect();
      const r = cart.getBoundingClientRect();
      const fantome = cart.cloneNode(true);
      fantome.classList.add("insertion");
      Object.assign(fantome.style, { left: (r.left - zone.left) + "px", top: (r.top - zone.top) + "px", width: r.width + "px", height: r.height + "px" });
      document.querySelector(".lcd.bas").appendChild(fantome);
      cart.style.visibility = "hidden";
      requestAnimationFrame(() => requestAnimationFrame(() => fantome.classList.add("entre")));
      setTimeout(() => { $("menu").classList.add("flash"); demarrer(blob, nomFichier); }, 430);
    } else {
      demarrer(blob, nomFichier);
    }
  }

  function demarrer(blob, nomFichier) {
    document.querySelector('.onglet[data-onglet="jeux"]').hidden = true;
    document.querySelector('.onglet[data-onglet="partie"]').hidden = false;

    let revele = false;
    const reveler = () => {
      if (revele) return;
      revele = true;
      jeuDemarre = true;
      document.body.classList.remove("chargement");
      $("menu").classList.add("parti");
      setTimeout(() => { if (!menuOuvert) { $("menu").style.display = "none"; focusJeu(); } }, 350);
    };

    window.EJS_player = "#game";
    window.EJS_core = "desmume";
    window.EJS_gameName = nomLisible(nomFichier);
    window.EJS_gameUrl = URL.createObjectURL(blob);
    window.EJS_pathtodata = CDN;
    window.EJS_startOnLoaded = true;
    window.EJS_defaultControls = construireControles();
    window.EJS_defaultOptions = { desmume_screens_gap: "64", desmume_screens_layout: "top/bottom" };
    window.EJS_gameID = PRESETS[presetChoisi].gameId;
    window.EJS_ready = () => setTimeout(reveler, 150);
    window.EJS_onGameStart = () => { reveler(); restaurerSram(); setTimeout(focusJeu, 100); };
    codesJeu = codesDuPreset();
    // Si l'émulateur attend un clic (son bloqué), on montre son écran quand même.
    setTimeout(reveler, 12000);

    if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(() => {});

    const script = document.createElement("script");
    script.src = CDN + "loader.js";
    script.onerror = () => {
      jeuActif = false;
      document.body.classList.remove("chargement");
      document.querySelector('.onglet[data-onglet="jeux"]').hidden = false;
      document.querySelector('.onglet[data-onglet="partie"]').hidden = true;
      $("message-haut").textContent = "Choisis une cartouche sur l'écran du bas.";
      $("erreur").textContent = "L'émulateur n'a pas pu se charger. Vérifie ta connexion, puis réessaie.";
      afficherCartouches();
    };
    discordPret.then(() => document.body.appendChild(script));
  }

  // ---------- Navigation dans le menu (manette, croix de la console) ----------
  function elementsNavigables() {
    return [...document.querySelectorAll("#menu button:not([disabled])")].filter(b => {
      if (b.closest("[hidden]")) return false;
      const r = b.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    });
  }
  function naviguer(action) {
    if (!action) return;
    document.body.classList.add("nav-manette");
    const liste = elementsNavigables();
    const actuel = liste.includes(document.activeElement) ? document.activeElement : null;
    if (action === "onglet-" || action === "onglet+") {
      const dispo = ongletsDisponibles();
      const i = dispo.indexOf(ongletActif);
      const j = (i + (action === "onglet+" ? 1 : -1) + dispo.length) % dispo.length;
      afficherOnglet(dispo[j]);
      const premier = elementsNavigables().find(b => !b.classList.contains("onglet"));
      if (premier) premier.focus();
      return;
    }
    if (action === "valider") { if (actuel) actuel.click(); return; }
    if (action === "retour") {
      if (menuOuvert) fermerPause();
      else if (ongletActif !== "jeux" && !jeuActif) afficherOnglet("jeux");
      return;
    }
    if (!actuel) { const p = liste.find(b => !b.classList.contains("onglet")) || liste[0]; if (p) p.focus(); return; }
    const a = actuel.getBoundingClientRect();
    const ca = { x: a.left + a.width / 2, y: a.top + a.height / 2 };
    let meilleur = null, score = Infinity;
    liste.forEach(b => {
      if (b === actuel) return;
      const r = b.getBoundingClientRect();
      const c = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      const dx = c.x - ca.x, dy = c.y - ca.y;
      let principal, secondaire;
      if (action === "haut") { principal = -dy; secondaire = Math.abs(dx); }
      else if (action === "bas") { principal = dy; secondaire = Math.abs(dx); }
      else if (action === "gauche") { principal = -dx; secondaire = Math.abs(dy); }
      else { principal = dx; secondaire = Math.abs(dy); }
      if (principal <= 2) return;
      const s = principal + secondaire * 2.2;
      if (s < score) { score = s; meilleur = b; }
    });
    if (meilleur) meilleur.focus();
  }

  const precedents = {};
  const repetition = {};
  let boucleLancee = false;
  function boucleManette() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    $("manette-ok").hidden = !pads.length;
    const m = MANETTES[manetteChoisie];
    const maintenant = performance.now();
    pads.forEach(p => {
      const avant = precedents[p.index] || [];
      const appuye = i => !!(p.buttons[i] && p.buttons[i].pressed);
      const nouveau = i => appuye(i) && !avant[i];
      const axeX = p.axes[0] || 0, axeY = p.axes[1] || 0;
      const directions = {
        haut: appuye(12) || axeY < -0.6, bas: appuye(13) || axeY > 0.6,
        gauche: appuye(14) || axeX < -0.6, droite: appuye(15) || axeX > 0.6
      };
      if (menuVisible()) {
        Object.entries(directions).forEach(([dir, actif]) => {
          const cle = p.index + dir;
          if (!actif) { delete repetition[cle]; return; }
          if (!repetition[cle]) { repetition[cle] = maintenant + 380; naviguer(dir); }
          else if (maintenant > repetition[cle]) { repetition[cle] = maintenant + 140; naviguer(dir); }
        });
        if (nouveau(m.valider)) naviguer("valider");
        if (nouveau(m.retour)) naviguer("retour");
        if (nouveau(4)) naviguer("onglet-");
        if (nouveau(5)) naviguer("onglet+");
        if (jeuDemarre && (nouveau(9) || nouveau(16))) fermerPause();
      } else if (jeuDemarre) {
        if (nouveau(16) || (appuye(8) && appuye(9) && (nouveau(8) || nouveau(9)))) ouvrirPause();
      }
      precedents[p.index] = p.buttons.map(b => b.pressed);
    });
    if (pads.length) requestAnimationFrame(boucleManette);
    else boucleLancee = false;
  }
  function lancerBoucle() { if (!boucleLancee) { boucleLancee = true; requestAnimationFrame(boucleManette); } }
  window.addEventListener("gamepadconnected", lancerBoucle);
  if (navigator.getGamepads && [...navigator.getGamepads()].some(Boolean)) lancerBoucle();
</script>
