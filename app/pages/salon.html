<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rétro</title>
<link rel="stylesheet" href="console/styles/00-polices.css">
<style>
  :root { --fond: #16181d; --panneau: #1f232b; --texte: #eef0f4; --texte-2: #9aa1ad; --h: 0; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--fond); color: var(--texte); font: 400 15px/1.45 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,.06); }
  header h1 { margin: 0; font: 600 26px/1 "Pixelify", system-ui, sans-serif; }
  header .pastille { width: 12px; height: 12px; border-radius: 50%; background: hsl(var(--h) 65% 55%); box-shadow: 0 0 10px hsl(var(--h) 65% 55% / .6); }
  header .espace { flex: 1; }
  button, .bouton { font: 600 14px/1 system-ui, sans-serif; color: var(--texte); background: #2b303b; border: 1px solid rgba(255,255,255,.08); border-radius: 9px; padding: 10px 14px; cursor: pointer; }
  button:hover, .bouton:hover { border-color: hsl(var(--h) 65% 60%); }
  button:focus-visible, .bouton:focus-visible { outline: 3px solid hsl(var(--h) 65% 60% / .6); outline-offset: 2px; }
  button.principal { background: hsl(var(--h) 55% 45%); border-color: transparent; }
  label.volume { display: flex; align-items: center; gap: 8px; color: var(--texte-2); font-size: 13px; }
  label.volume input { accent-color: hsl(var(--h) 65% 55%); width: 110px; }
  main { min-height: 0; overflow: hidden; }
  /* Catalogue plein écran ; pendant une partie, l'écran prend toute la place */
  .catalogue { height: 100%; overflow-y: auto; padding: 22px 28px 28px; }
  body.en-jeu .catalogue { display: none; }
  body:not(.en-jeu) .scene { display: none; }
  .barre { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
  .barre p { margin: 0 0 0 6px; color: var(--texte-2); font-size: 13px; }
  .grille-jeux { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .jeu { position: relative; }
  .jeu > button.carte {
    width: 100%; display: grid; grid-template-rows: 130px auto; padding: 0; overflow: hidden; text-align: left;
    background: var(--panneau); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; transition: transform .1s, border-color .1s;
  }
  .jeu > button.carte:hover, .jeu > button.carte:focus-visible { transform: translateY(-3px); border-color: hsl(var(--h) 65% 60%); }
  .jaquette { display: grid; place-items: center; background: linear-gradient(160deg, hsl(var(--t) 50% 38%), hsl(var(--t) 45% 20%)); font: 600 38px/1 "Pixelify", system-ui, sans-serif; color: rgba(255,255,255,.92); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .carte .titre-jeu { padding: 10px 12px 12px; font-weight: 600; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .carte small { display: block; color: var(--texte-2); font-weight: 400; font-size: 12px; margin-top: 2px; }
  .jeu .retirer { position: absolute; top: 8px; right: 8px; padding: 6px 9px; font-size: 12px; background: rgba(0,0,0,.55); opacity: 0; }
  .jeu:hover .retirer, .jeu .retirer:focus-visible, .jeu .retirer.arme { opacity: 1; }
  .jeu .retirer.arme { background: #b3261e; }
  .vide { color: var(--texte-2); margin-top: 28px; max-width: 560px; }
  .vide strong { display: block; color: var(--texte); font: 600 22px/1.3 "Pixelify", system-ui, sans-serif; margin-bottom: 8px; }
  .vide code { background: #2b303b; border-radius: 5px; padding: 2px 6px; color: var(--texte); }
  .message { min-height: 1.4em; color: var(--texte-2); font-size: 13px; }
  .scene { height: 100%; }
  .scene { display: grid; place-items: center; padding: 18px; min-height: 0; background: radial-gradient(900px 500px at 50% 0%, hsl(var(--h) 30% 16%), transparent 70%); }
  .tele { position: relative; width: min(100%, calc((100vh - 120px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; border-radius: 14px; box-shadow: 0 0 0 10px #0d0f13, 0 20px 50px rgba(0,0,0,.5); overflow: hidden; }
  #game { position: absolute; inset: 0; }
  .aide { color: var(--texte-2); font-size: 13px; margin-top: 14px; text-align: center; }
  kbd { font: 600 12px/1 system-ui; background: #2b303b; border-radius: 5px; padding: 3px 6px; border: 1px solid rgba(255,255,255,.1); }
  .pause { position: absolute; inset: 0; background: rgba(10,12,16,.82); display: none; place-items: center; z-index: 10; }
  body.en-pause .pause { display: grid; }
  .pause div { display: grid; gap: 10px; min-width: 260px; }
  .pause h2 { margin: 0 0 6px; font: 600 24px/1 "Pixelify", system-ui, sans-serif; text-align: center; }
  .pause small { color: var(--texte-2); text-align: center; }
  #game .ejs_menu_bar, #game .ejs_context_menu { display: none !important; }
  .message { min-height: 1.4em; color: var(--texte-2); font-size: 13px; }
</style>
</head>
<body>
<header>
  <a class="bouton" href="accueil.html" id="accueil">← Accueil</a>
  <span class="pastille" aria-hidden="true"></span>
  <h1 id="titre">Console</h1>
  <span class="espace"></span>
  <label class="volume">Son <input type="range" id="volume" min="0" max="100" step="5" aria-label="Volume du son"></label>
  <button type="button" id="menu-jeu" hidden>Pause</button>
</header>
<main>
  <section class="catalogue" aria-label="Catalogue de jeux">
    <div class="barre">
      <button type="button" class="principal" id="ajouter">Ajouter des jeux</button>
      <button type="button" id="dossier" hidden>Ouvrir mon dossier de jeux</button>
      <p id="formats"></p>
    </div>
    <div class="barre" id="barre-emulateur" hidden>
      <button type="button" id="installer-emulateur" hidden></button>
      <p id="etat-emulateur"></p>
    </div>
    <p class="message" id="message" role="status"></p>
    <ul class="grille-jeux" id="jeux"></ul>
  </section>
  <section class="scene">
    <div>
      <div class="tele">
        <div id="game"></div>
        <div class="pause" role="dialog" aria-label="Pause">
          <div>
            <h2>Pause</h2>
            <button type="button" class="principal" id="reprendre">Reprendre</button>
            <button type="button" id="sauver-etat">Sauver l'état</button>
            <button type="button" id="charger-etat">Charger l'état</button>
            <button type="button" id="pistolet" hidden></button>
            <button type="button" id="quitter">Retour au catalogue</button>
            <small>Échap ou Select + Start pour revenir au jeu</small>
          </div>
        </div>
      </div>
      <p class="aide" id="aide-pistolet" hidden>Pistolet : vise avec la souris, clic gauche pour tirer.</p>
      <p class="aide" id="aide-commandes"></p>
    </div>
  </section>
</main>
<input type="file" id="fichier" multiple hidden>
<script src="commandes.js"></script>
<script>
// L'image du jeu reste lisible (capture, diffusion aux potes) : comme dans la console DS.
(function () {
  const avant = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, options) {
    if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") options = Object.assign({}, options, { preserveDrawingBuffer: true });
    return avant.call(this, type, options);
  };
})();
(function () {
  "use strict";
  // Une page pour toutes les consoles de salon. Le cœur de chaque console est hébergé avec l'appli.
  const CONSOLES = {
    nes: { nom: "NES", coeur: "fceumm", h: 0, extensions: [".nes", ".zip", ".7z"], formats: "Fichiers .nes (ou un .zip / .7z qui en contient un)." },
    snes: { nom: "Super Nintendo", coeur: "snes9x", h: 265, extensions: [".sfc", ".smc", ".zip", ".7z"], formats: "Fichiers .sfc ou .smc (ou un .zip / .7z)." },
    n64: { nom: "Nintendo 64", coeur: "mupen64plus_next", h: 140, extensions: [".z64", ".n64", ".v64", ".zip", ".7z"], formats: "Fichiers .z64, .n64 ou .v64 (ou un .zip / .7z)." },
    psx: { nom: "PlayStation", coeur: "pcsx_rearmed", h: 210, extensions: [".chd", ".pbp", ".zip", ".7z", ".iso"], formats: "Un fichier .chd ou .pbp, ou un .zip avec le .cue et les .bin du jeu." },
    // Consoles lancées avec un émulateur externe (téléchargé au premier jeu)
    "3ds": { nom: "3DS", externe: "Azahar", h: 350, extensions: [".cci", ".3ds", ".cxi", ".3dsx", ".zcci", ".zcxi", ".z3dsx"], formats: "Tes jeux 3DS déchiffrés : .cci (un .3ds déchiffré renommé en .cci marche), .cxi ou .3dsx." },
  };
  // Pistolet à la souris : un pistolet branché sur le port 2, visé avec la souris (clic = tir).
  // L'émulateur web lit la souris comme un écran tactile : visée exacte, sans dérive.
  const PROFIL_SOURIS = { n64: true, psx: true };
  const PISTOLETS = {
    nes: { nom: "Zapper", cfg: ['input_libretro_device_p2 = "258"'], options: { fceumm_zapper_mode: "touchscreen", fceumm_show_crosshair: "enabled" },
      jeux: /duck hunt|hogan'?s alley|wild gunman|gumshoe|freedom force|operation wolf|baby boomer|chiller|shooting range|to the earth|mechanized attack|barker bill|laser invasion|lone ranger|gotcha/i },
    snes: { nom: "Super Scope", cfg: ['input_libretro_device_p2 = "260"'], options: { snes9x_lightgun_mode: "Touchscreen" },
      jeux: /super scope|yoshi'?s safari|battle clash|metal combat|terminator 2.*arcade|t2.*arcade|x-zone|lamborghini|tin star|hunt for red october|bazooka blitzkrieg|operation thunderbolt/i },
  };
  const id = new URLSearchParams(location.search).get("console");
  const AIDES = {
    nes: "Clavier : <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> bouger · <kbd>Espace</kbd> ou <kbd>K</kbd> A · <kbd>J</kbd> B · <kbd>Entrée</kbd> Start · <kbd>Retour</kbd> Select. Manette : stick ou croix, A/B, gâchettes RT = B (tir) et LT = A.",
    snes: "Clavier : <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> bouger · <kbd>K</kbd> B · <kbd>L</kbd> A · <kbd>J</kbd> Y · <kbd>I</kbd> X · <kbd>A</kbd> <kbd>E</kbd> L / R · <kbd>Entrée</kbd> Start. Manette : stick ou croix, gâchettes et bumpers = L / R.",
    n64: "Clavier : <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> stick · souris caméra (boutons C) · clic gauche Z (tir) · clic droit R (viser) · <kbd>Espace</kbd> A · <kbd>J</kbd> B · <kbd>Maj</kbd> Z · <kbd>A</kbd> <kbd>E</kbd> L / R · <kbd>↑↓←→</kbd> boutons C · <kbd>Entrée</kbd> Start. Manette : stick gauche, stick droit = boutons C, gâchettes = Z, bumpers = L / R.",
    psx: "Clavier : <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> bouger · souris caméra · clic gauche R2 · clic droit L2 · <kbd>Espace</kbd> ✕ · <kbd>L</kbd> ○ · <kbd>J</kbd> □ · <kbd>I</kbd> △ · <kbd>A</kbd> <kbd>E</kbd> L1 / R1 · <kbd>Maj</kbd> L2 · <kbd>R</kbd> R2 · <kbd>Entrée</kbd> Start. Manette DualShock : deux sticks, gâchettes L2 / R2.",
  };
  const C = CONSOLES[id];
  const $ = x => document.getElementById(x);
  if (!C) { location.href = "accueil.html"; return; }
  document.title = "Rétro · " + C.nom;
  document.documentElement.style.setProperty("--h", C.h);
  $("titre").textContent = C.nom;
  $("formats").textContent = C.formats;
  $("fichier").accept = C.extensions.join(",");
  if (C.externe) {
    $("ajouter").hidden = true;
    document.querySelector("label.volume").hidden = true;
    $("barre-emulateur").hidden = false;
  }

  // ---------- Stockage local (IndexedDB) ----------
  let base;
  const ouvrir = () => base || (base = new Promise((ok, ko) => {
    const r = indexedDB.open("retro-salon", 1);
    r.onupgradeneeded = () => { for (const s of ["jeux", "sauvegardes", "etats"]) r.result.createObjectStore(s, { keyPath: "id" }); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }));
  const magasin = async (s, mode, f) => { const db = await ouvrir(); return new Promise((ok, ko) => { const t = db.transaction(s, mode); const q = f(t.objectStore(s)); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); }); };
  const lire = (s, k) => magasin(s, "readonly", o => o.get(k));
  const ecrire = (s, v) => magasin(s, "readwrite", o => o.put(v));
  const effacer = (s, k) => magasin(s, "readwrite", o => o.delete(k));
  const tous = s => magasin(s, "readonly", o => o.getAll());
  const nomLisible = n => n.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");

  // ---------- Catalogue : le dossier de jeux du PC + les jeux ajoutés à la main ----------
  const teinte = t => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const initiales = t => nomLisible(t).split(/\s+/).filter(Boolean).slice(0, 2).map(m => m[0]).join("").toUpperCase() || "?";
  const accepte = n => C.extensions.some(x => n.toLowerCase().endsWith(x));
  let cheminDossier = null;
  async function jeuxDuDossier() {
    try {
      const r = await fetch("jeux-pc/" + id + "/", { cache: "no-store" });
      if (!r.ok) return [];
      return (await r.json()).filter(f => accepte(f.nom)).map(f => ({ id: id + ":" + f.nom + "|" + f.taille, console: id, nom: f.nom, taille: f.taille, source: "pc" }));
    } catch (e) { return []; }
  }
  async function afficherJeux() {
    const ajoutes = (await tous("jeux")).filter(j => j.console === id).map(j => ({ ...j, source: "ajoute" }));
    const pc = await jeuxDuDossier();
    const vus = new Set(pc.map(j => j.id));
    const liste = pc.concat(ajoutes.filter(j => !vus.has(j.id))).sort((a, b) => nomLisible(a.nom).localeCompare(nomLisible(b.nom), "fr"));
    const ul = $("jeux"); ul.innerHTML = "";
    $("message").textContent = liste.length ? liste.length + (liste.length > 1 ? " jeux" : " jeu") : "";
    if (!liste.length) {
      const vide = document.createElement("li"); vide.className = "vide"; vide.style.gridColumn = "1 / -1";
      vide.innerHTML = "<strong>Aucun jeu pour l'instant</strong>";
      const p = document.createElement("p");
      if (cheminDossier) { p.append("Mets tes jeux dans "); const c = document.createElement("code"); c.textContent = cheminDossier; p.append(c, " : ils apparaissent ici tout seuls. Ou clique sur « Ajouter des jeux »."); }
      else p.textContent = "Clique sur « Ajouter des jeux » pour choisir des fichiers sur ton PC.";
      vide.appendChild(p); ul.appendChild(vide); return;
    }
    for (const j of liste) {
      const li = document.createElement("li"); li.className = "jeu";
      const carte = document.createElement("button"); carte.type = "button"; carte.className = "carte";
      carte.style.setProperty("--t", teinte(j.nom));
      carte.setAttribute("aria-label", "Jouer à " + nomLisible(j.nom));
      const jaq = document.createElement("span"); jaq.className = "jaquette"; jaq.textContent = initiales(j.nom);
      const t = document.createElement("span"); t.className = "titre-jeu"; t.textContent = nomLisible(j.nom);
      const sous = document.createElement("small"); sous.textContent = j.source === "pc" ? "Dans ton dossier" : "Ajouté à l'appli";
      t.appendChild(sous);
      carte.append(jaq, t);
      carte.addEventListener("click", () => lancer(j));
      li.appendChild(carte);
      if (j.source === "ajoute") {
        const retirer = document.createElement("button"); retirer.type = "button"; retirer.className = "retirer"; retirer.textContent = "Retirer";
        retirer.setAttribute("aria-label", "Retirer " + nomLisible(j.nom));
        let arme = false;
        retirer.addEventListener("click", async () => {
          if (!arme) { arme = true; retirer.classList.add("arme"); retirer.textContent = "Sûr ?"; setTimeout(() => { arme = false; retirer.classList.remove("arme"); retirer.textContent = "Retirer"; }, 3000); return; }
          await effacer("jeux", j.id); afficherJeux();
        });
        li.appendChild(retirer);
      }
      ul.appendChild(li);
    }
  }
  $("ajouter").addEventListener("click", () => $("fichier").click());
  $("fichier").addEventListener("change", async e => {
    const fichiers = [...e.target.files].filter(f => accepte(f.name));
    const ignores = e.target.files.length - fichiers.length;
    for (const f of fichiers) await ecrire("jeux", { id: id + ":" + f.name + "|" + f.size, console: id, nom: f.name, taille: f.size, ajoute: Date.now(), blob: f });
    e.target.value = "";
    await afficherJeux();
    if (ignores) $("message").textContent += " · " + ignores + " fichier(s) ignoré(s) : format non reconnu pour la " + C.nom + ".";
  });
  if (window.retroApp) {
    $("dossier").hidden = false;
    $("dossier").addEventListener("click", () => retroApp.ouvrirDossier(id));
    retroApp.cheminDossier(id).then(c => { cheminDossier = c; afficherJeux(); });
    // Le dossier change pendant que l'appli est ouverte : on relit quand on revient sur la fenêtre.
    addEventListener("focus", () => { if (!partie) afficherJeux(); });
  }

  // Navigation dans la grille au clavier et à la manette
  function deplacer(dx, dy) {
    const cartes = [...document.querySelectorAll(".carte")];
    if (!cartes.length) return;
    const actuelle = cartes.includes(document.activeElement) ? document.activeElement : null;
    if (!actuelle) return cartes[0].focus();
    const r = actuelle.getBoundingClientRect();
    let meilleure = null, score = Infinity;
    for (const c of cartes) {
      if (c === actuelle) continue;
      const s2 = c.getBoundingClientRect(), x = s2.left - r.left, y = s2.top - r.top;
      if (dx && (Math.sign(x) !== dx || Math.abs(y) > r.height / 2)) continue;
      if (dy && Math.sign(y) !== dy) continue;
      const d = Math.abs(x) + Math.abs(y) * 2;
      if (d < score) { score = d; meilleure = c; }
    }
    if (meilleure) { meilleure.focus(); meilleure.scrollIntoView({ block: "nearest" }); }
  }
  addEventListener("keydown", e => {
    if (partie) return;
    const t = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (t) { e.preventDefault(); deplacer(...t); }
    if (e.key === "Escape" || e.key === "Backspace") location.href = "accueil.html";
  });

  // ---------- Volume ----------
  let volume = Number(localStorage.getItem("ds-retro-volume") || 70);
  const appliquerVolume = () => {
    $("volume").value = volume;
    try { if (window.EJS_emulator && EJS_emulator.setVolume) { EJS_emulator.volume = volume / 100; EJS_emulator.setVolume(volume / 100); } } catch (e) {}
  };
  $("volume").addEventListener("input", e => { volume = Number(e.target.value); localStorage.setItem("ds-retro-volume", String(volume)); appliquerVolume(); });
  appliquerVolume();

  // ---------- Émulateur externe (3DS…) : installé au premier jeu, puis lancé en plein écran ----------
  let emulateurPret = false, occupe = false;
  async function majEmulateur() {
    if (!C.externe) return;
    if (!window.retroApp) { $("etat-emulateur").textContent = "La " + C.nom + " marche seulement dans l'appli Rétro pour PC."; return; }
    const e = await retroApp.emulateurEtat(id);
    emulateurPret = Boolean(e && e.installe);
    const b = $("installer-emulateur");
    if (emulateurPret) {
      $("etat-emulateur").textContent = e.nom + " " + (e.version || "") + " est installé. Choisis un jeu : il s'ouvre dans " + e.nom + ", ferme-le pour revenir ici.";
      b.hidden = true;
    } else {
      $("etat-emulateur").textContent = C.externe + " n'est pas encore installé. L'appli le télécharge depuis sa page officielle (GitHub) quand tu lances ton premier jeu.";
      b.hidden = false; b.textContent = "Installer " + C.externe + " maintenant";
    }
  }
  async function installerEmulateur() {
    if (occupe) return false;
    occupe = true; $("installer-emulateur").disabled = true;
    const arret = retroApp.surProgression(p => {
      $("etat-emulateur").textContent = p.etape === "telechargement" && p.total
        ? p.texte + " : " + Math.round(p.recus / p.total * 100) + " % (" + Math.round(p.total / 1e6) + " Mo)"
        : p.texte;
    });
    const r = await retroApp.installerEmulateur(id);
    arret(); occupe = false; $("installer-emulateur").disabled = false;
    if (!r.ok) { $("etat-emulateur").textContent = "Installation impossible : " + r.erreur + ". Vérifie ta connexion, puis réessaie."; return false; }
    await majEmulateur();
    return true;
  }
  $("installer-emulateur").addEventListener("click", installerEmulateur);
  async function lancerExterne(jeu) {
    if (!window.retroApp || occupe) return;
    if (!emulateurPret && !(await installerEmulateur())) return;
    occupe = true;
    $("etat-emulateur").textContent = nomLisible(jeu.nom) + " est lancé dans " + C.externe + ". Ferme " + C.externe + " pour revenir ici.";
    const r = await retroApp.lancerExterne(id, jeu.nom);
    occupe = false;
    if (!r.ok) $("etat-emulateur").textContent = "Lancement impossible : " + r.erreur + ".";
    else majEmulateur();
  }

  // ---------- Partie ----------
  let partie = null, empreinte = "";
  const empreinteDe = o => { let h = 2166136261; for (let i = 0; i < o.length; i++) h = Math.imul(h ^ o[i], 16777619); return o.length + ":" + (h >>> 0); };
  const choixPistolet = j => localStorage.getItem("retro-pistolet:" + j.id) || "auto";
  const pistoletActif = j => Boolean(PISTOLETS[id]) && (choixPistolet(j) === "oui" || (choixPistolet(j) === "auto" && PISTOLETS[id].jeux.test(j.nom)));
  async function lancer(jeu) {
    if (C.externe) return lancerExterne(jeu);
    if (partie) return;
    if (!jeu.blob) {
      $("message").textContent = "Chargement de " + nomLisible(jeu.nom) + "…";
      try { const r = await fetch("jeux-pc/" + id + "/" + encodeURIComponent(jeu.nom)); if (!r.ok) throw new Error(r.status); jeu = { ...jeu, blob: await r.blob() }; }
      catch (e) { $("message").textContent = "Ce jeu n'est plus dans ton dossier."; return afficherJeux(); }
    }
    partie = jeu;
    document.body.classList.add("en-jeu");
    $("menu-jeu").hidden = false;
    $("game").addEventListener("contextmenu", e => { e.preventDefault(); e.stopPropagation(); }, true);
    Object.assign(window, {
      EJS_player: "#game", EJS_core: C.coeur, EJS_gameName: nomLisible(jeu.nom), EJS_gameUrl: URL.createObjectURL(jeu.blob),
      EJS_pathtodata: "emulateur/", EJS_startOnLoaded: true, EJS_volume: volume / 100, EJS_color: "#2b303b",
      EJS_Buttons: Object.fromEntries(["playPause", "restart", "mute", "settings", "fullscreen", "saveState", "loadState", "screenRecord", "gamepad", "cheat", "volumeSlider", "saveSavFiles", "loadSavFiles", "quickSave", "quickLoad", "screenshot", "cacheManager", "exitEmulation", "netplay", "diskButton"].map(b => [b, false])),
      EJS_onGameStart: () => { restaurer(); appliquerVolume(); RetroCommandes.demarrer(id, Boolean(pistolet)); },
      EJS_defaultControls: { 0: {}, 1: {}, 2: {}, 3: {} },
    });
    const pistolet = pistoletActif(jeu) ? PISTOLETS[id] : null;
    window.EJS_retroarchExtra = RetroCommandes.retroarch(id).concat(pistolet ? pistolet.cfg : []);
    window.EJS_defaultOptions = pistolet ? pistolet.options : {};
    $("game").style.cursor = pistolet ? "crosshair" : "";
    $("aide-pistolet").hidden = !pistolet;
    $("aide-commandes").innerHTML = (AIDES[id] || "") + (PROFIL_SOURIS[id] && !pistolet ? " Clique dans le jeu pour prendre la souris, <kbd>Échap</kbd> pour la rendre." : "");
    if (PISTOLETS[id]) {
      $("pistolet").hidden = false;
      $("pistolet").textContent = PISTOLETS[id].nom + " à la souris : " + (pistolet ? "activé" : "désactivé");
    }
    const s = document.createElement("script"); s.src = "emulateur/loader.js";
    s.onerror = () => { $("message").textContent = "L'émulateur n'a pas pu se charger."; };
    document.body.appendChild(s);
  }
  async function restaurer() {
    try {
      const sv = await lire("sauvegardes", partie.id);
      if (!sv) return;
      const gm = EJS_emulator.gameManager;
      gm.FS.writeFile(gm.getSaveFilePath(), sv.donnees); gm.loadSaveFiles();
      empreinte = empreinteDe(sv.donnees);
    } catch (e) {}
  }
  async function sauver() {
    try {
      if (!partie || !window.EJS_emulator || !EJS_emulator.gameManager) return;
      const d = EJS_emulator.gameManager.getSaveFile();
      if (!d || !d.length) return;
      const o = new Uint8Array(d), e = empreinteDe(o);
      if (e === empreinte) return;
      empreinte = e;
      await ecrire("sauvegardes", { id: partie.id, donnees: o, maj: Date.now() });
    } catch (e) {}
  }
  setInterval(sauver, 15000);
  addEventListener("pagehide", sauver);
  addEventListener("visibilitychange", () => { if (document.hidden) sauver(); });

  // ---------- Pause ----------
  const enPause = () => document.body.classList.contains("en-pause");
  function pause(oui) {
    if (!partie || !window.EJS_emulator) return;
    document.body.classList.toggle("en-pause", oui);
    if (oui) RetroCommandes.liberer();
    try { oui ? EJS_emulator.pause() : EJS_emulator.play(); } catch (e) {}
    if (oui) { sauver(); $("reprendre").focus(); } else { const c = document.querySelector("#game canvas"); if (c) { c.tabIndex = -1; c.focus(); } }
  }
  $("menu-jeu").addEventListener("click", () => pause(!enPause()));
  $("reprendre").addEventListener("click", () => pause(false));
  addEventListener("keydown", e => { if (e.key === "Escape" && partie) { e.preventDefault(); pause(!enPause()); } }, true);
  $("sauver-etat").addEventListener("click", async () => {
    try { await ecrire("etats", { id: partie.id, etat: new Uint8Array(EJS_emulator.gameManager.getState()), maj: Date.now() }); $("sauver-etat").textContent = "État sauvé"; setTimeout(() => { $("sauver-etat").textContent = "Sauver l'état"; }, 1500); } catch (e) {}
  });
  $("charger-etat").addEventListener("click", async () => {
    const e = await lire("etats", partie.id).catch(() => null);
    if (!e) { $("charger-etat").textContent = "Aucun état sauvé"; setTimeout(() => { $("charger-etat").textContent = "Charger l'état"; }, 1500); return; }
    EJS_emulator.gameManager.loadState(e.etat); pause(false);
  });
  $("quitter").addEventListener("click", async () => { await sauver(); location.reload(); });
  // Changer le pistolet : le réglage s'applique au lancement, donc on relance le jeu (sauvegarde copiée avant).
  $("pistolet").addEventListener("click", async () => {
    if (!partie) return;
    localStorage.setItem("retro-pistolet:" + partie.id, pistoletActif(partie) ? "non" : "oui");
    await sauver();
    sessionStorage.setItem("retro-relancer", partie.id);
    location.reload();
  });
  $("accueil").addEventListener("click", async e => { if (partie) { e.preventDefault(); await sauver(); location.href = "accueil.html"; } });

  // Manette : dans le catalogue, croix pour choisir, A pour jouer, B pour l'accueil ; en jeu, Select + Start = pause
  let avant = {};
  (function boucle() {
    const m = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
    if (m) {
      const b = i => Boolean(m.buttons[i] && m.buttons[i].pressed);
      const e = { g: b(14) || m.axes[0] < -0.6, d: b(15) || m.axes[0] > 0.6, h: b(12) || m.axes[1] < -0.6, bas: b(13) || m.axes[1] > 0.6, a: b(0), b: b(1), pause: b(8) && b(9) };
      if (partie) { if (e.pause && !avant.pause) pause(!enPause()); }
      else {
        if (e.g && !avant.g) deplacer(-1, 0);
        if (e.d && !avant.d) deplacer(1, 0);
        if (e.h && !avant.h) deplacer(0, -1);
        if (e.bas && !avant.bas) deplacer(0, 1);
        if (e.a && !avant.a && document.activeElement && document.activeElement.classList.contains("carte")) document.activeElement.click();
        if (e.b && !avant.b) location.href = "accueil.html";
      }
      avant = e;
    }
    requestAnimationFrame(boucle);
  })();

  majEmulateur();
  afficherJeux().then(async () => {
    const relancer = sessionStorage.getItem("retro-relancer");
    sessionStorage.removeItem("retro-relancer");
    if (relancer) {
      const j = (await tous("jeux")).find(x => x.id === relancer) || (await jeuxDuDossier()).find(x => x.id === relancer);
      if (j) return lancer(j);
    }
    const c = document.querySelector(".carte"); if (c) c.focus();
  });
})();
</script>
</body>
</html>
