<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rétro</title>
<link rel="stylesheet" href="console/styles/00-polices.css">
<link rel="stylesheet" href="supports.css">
<style>
  :root {
    --fond: #16181d; --fond-2: #1f232b; --texte: #eef0f4; --texte-2: #9aa1ad;
    --accent: #6c7cff; --pret: #43c47a; --u: clamp(10px, 1.1vw, 16px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #2a2f3a 0%, transparent 60%), var(--fond);
    color: var(--texte); font: 400 16px/1.5 system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  header { display: flex; align-items: baseline; gap: 18px; padding: 28px 40px 8px; }
  h1 { margin: 0; font: 600 44px/1 "Pixelify", system-ui, sans-serif; letter-spacing: 1px; }
  header p { margin: 0; color: var(--texte-2); }
  main { overflow-y: auto; padding: 16px 40px 32px; }
  h2 { font: 600 15px/1 system-ui, sans-serif; color: var(--texte-2); margin: 18px 0 12px; }
  .rangee { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .console {
    position: relative; display: grid; grid-template-rows: 140px auto; text-align: left;
    background: var(--fond-2); border: 1px solid rgba(255,255,255,.06); border-radius: 14px;
    padding: 0; overflow: hidden; color: inherit; font: inherit; cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .console:hover, .console:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .console:focus-visible { box-shadow: 0 0 0 3px rgba(108,124,255,.45); }
  .console[aria-disabled="true"] { cursor: default; opacity: .55; }
  .console[aria-disabled="true"]:hover { transform: none; border-color: rgba(255,255,255,.06); }
  .visuel { position: relative; display: grid; place-items: end center; overflow: hidden; background: radial-gradient(120% 90% at 50% 100%, hsl(var(--h) 40% 26%), hsl(var(--h) 30% 13%) 70%); }
  .visuel .etiquette { font-size: 20px; }
  .visuel::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: linear-gradient(#3a3227, #241e17); }
  .chercher { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .chercher button { font: 600 15px/1 system-ui, sans-serif; color: #08140d; background: var(--pret); border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  .chercher button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .chercher button:disabled { opacity: .6; cursor: default; }
  .chercher p { margin: 0; color: var(--texte-2); font-size: 13px; max-width: 360px; }
  .infos { padding: 12px 14px 14px; }
  .infos strong { display: block; font-size: 16px; }
  .infos small { color: var(--texte-2); }
  .etat { position: absolute; top: 10px; right: 10px; font: 600 11px/1 system-ui, sans-serif; padding: 5px 8px; border-radius: 99px; background: rgba(0,0,0,.45); }
  .etat.pret { background: var(--pret); color: #08140d; }
  footer { padding: 10px 40px 16px; color: var(--texte-2); font-size: 13px; display: flex; justify-content: space-between; }
  footer .maj { display: flex; align-items: center; gap: 10px; }
  #maj { font: 600 13px/1 system-ui, sans-serif; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: inherit; cursor: pointer; }
  #maj:hover, #maj:focus-visible { background: rgba(255,255,255,.14); outline: 2px solid var(--pret); outline-offset: 2px; }
  #maj.nouvelle { background: var(--pret); color: #08140d; border-color: transparent; }
  #maj:disabled { opacity: .6; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .console { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Rétro</h1>
  <p>Choisis une console. Tes jeux restent chez toi, tes sauvegardes te suivent.</p>
  <div class="chercher" id="zone-chercher" hidden>
    <p id="resultat-recherche" role="status">Trouve les jeux de ton PC et range-les dans la bonne console.</p>
    <button type="button" id="chercher">Chercher mes jeux</button>
  </div>
</header>
<main>
  <h2>Disponibles</h2>
  <div class="rangee" id="disponibles"></div>
  <h2>Bientôt</h2>
  <div class="rangee" id="bientot"></div>
</main>
<footer><span>Flèches ou manette pour choisir, Entrée ou A pour lancer.</span><span class="maj"><span id="version"></span> <button type="button" id="maj" hidden>Chercher une mise à jour</button></span></footer>
<script>
  // Consoles de l'appli. « page » = console prête ; les autres arrivent dans les prochaines versions.
  const CONSOLES = [
    { support: "carte", nom: "DS, GBA et Game Boy", detail: "DS Lite : jeux DS, GBA, Game Boy, Game Boy Color", sigle: "DS", h: 220, page: "index.html" },
    { nom: "NES", detail: "1983", sigle: "NES", support: "cartouche", h: 0, page: "salon.html?console=nes" },
    { nom: "Super Nintendo", detail: "1990", sigle: "SNES", support: "cartouche", h: 265, page: "salon.html?console=snes" },
    { nom: "Nintendo 64", detail: "1996", sigle: "N64", support: "cartouche", h: 140, page: "salon.html?console=n64" },
    { nom: "PlayStation", detail: "1994", sigle: "PS1", support: "disque", h: 210, page: "salon.html?console=psx" },
    { nom: "3DS", detail: "avec Azahar, installé au premier jeu", sigle: "3DS", support: "carte", h: 350, page: "salon.html?console=3ds" },
    { nom: "Switch", detail: "avec Eden, tes clés et ton firmware", sigle: "NX", support: "carte", h: 355, page: "salon.html?console=switch" },
    { nom: "PSP", detail: "avec PPSSPP", sigle: "PSP", support: "umd", h: 200, page: "salon.html?console=psp" },
    { nom: "PlayStation 2", detail: "avec PCSX2 et le BIOS de ta PS2", sigle: "PS2", support: "boitier", h: 230, page: "salon.html?console=ps2" },
    { nom: "PlayStation 3", detail: "avec RPCS3 et le firmware PS3", sigle: "PS3", support: "boitier", h: 0, page: "salon.html?console=ps3" },
    { nom: "GameCube et Wii", detail: "avec Dolphin", sigle: "GC", support: "disque", h: 255 },
  ];
  const tuile = c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "console";
    b.style.setProperty("--h", c.h);
    b.style.setProperty("--t", c.h);
    b.innerHTML = '<div class="visuel"><span class="media"><span class="etiquette"></span></span></div><div class="infos"><strong></strong><small></small></div><i class="etat"></i>';
    b.querySelector(".visuel").dataset.support = c.support;
    b.querySelector(".etiquette").textContent = c.sigle;
    b.querySelector("strong").textContent = c.nom;
    b.querySelector("small").textContent = c.detail;
    const etat = b.querySelector(".etat");
    if (c.page) { etat.textContent = "Prête"; etat.classList.add("pret"); b.addEventListener("click", () => { location.href = c.page; }); }
    else { etat.textContent = "Bientôt"; b.setAttribute("aria-disabled", "true"); }
    return b;
  };
  CONSOLES.forEach(c => document.getElementById(c.page ? "disponibles" : "bientot").appendChild(tuile(c)));
  const tuiles = () => [...document.querySelectorAll(".console")];
  tuiles()[0].focus();

  // Navigation au clavier et à la manette dans la grille
  function deplacer(dx, dy) {
    const liste = tuiles(), i = Math.max(0, liste.indexOf(document.activeElement));
    const r = liste[i].getBoundingClientRect();
    let meilleur = null, score = Infinity;
    liste.forEach((t, j) => {
      if (j === i) return;
      const s = t.getBoundingClientRect(), x = s.left - r.left, y = s.top - r.top;
      if ((dx && Math.sign(x) !== dx) || (dy && Math.sign(y) !== dy) || (dx && Math.abs(y) > r.height / 2) ) return;
      const d = Math.abs(x) + Math.abs(y) * 2;
      if (d < score) { score = d; meilleur = t; }
    });
    if (meilleur) meilleur.focus();
  }
  addEventListener("keydown", e => {
    const t = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (t) { e.preventDefault(); deplacer(...t); }
  });
  let avant = {};
  (function boucle() {
    const m = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
    if (m) {
      const b = i => m.buttons[i] && m.buttons[i].pressed;
      const etat = { g: b(14) || m.axes[0] < -0.6, d: b(15) || m.axes[0] > 0.6, h: b(12) || m.axes[1] < -0.6, b: b(13) || m.axes[1] > 0.6, a: b(0) };
      if (etat.g && !avant.g) deplacer(-1, 0);
      if (etat.d && !avant.d) deplacer(1, 0);
      if (etat.h && !avant.h) deplacer(0, -1);
      if (etat.b && !avant.b) deplacer(0, 1);
      if (etat.a && !avant.a && document.activeElement.classList.contains("console")) document.activeElement.click();
      avant = etat;
    }
    requestAnimationFrame(boucle);
  })();
  // Chercher mes jeux : dossiers choisis par le joueur, chaque jeu rangé dans sa console.
  const NOMS = { nes: "NES", snes: "Super Nintendo", n64: "Nintendo 64", psx: "PlayStation", "3ds": "3DS", switch: "Switch", psp: "PSP", ps2: "PlayStation 2", ps3: "PlayStation 3" };
  if (window.retroApp && retroApp.chercherJeux) {
    const zone = document.getElementById("zone-chercher"), bouton = document.getElementById("chercher"), texte = document.getElementById("resultat-recherche");
    zone.hidden = false;
    bouton.addEventListener("click", async () => {
      bouton.disabled = true;
      const arret = retroApp.surRecherche(p => { texte.textContent = p.texte; });
      const r = await retroApp.chercherJeux();
      arret(); bouton.disabled = false;
      if (r.annule) { texte.textContent = "Trouve les jeux de ton PC et range-les dans la bonne console."; return; }
      if (!r.ok) { texte.textContent = "Recherche impossible : " + r.erreur; return; }
      const parties = Object.entries(r.ajoutes).filter(([c]) => NOMS[c]).map(([c, n]) => n + " " + NOMS[c]);
      const autres = (r.ajoutes.ds || 0) + (r.ajoutes.gc || 0);
      texte.textContent = parties.length ? "Ajoutés : " + parties.join(", ") + "." : (r.trouves ? "Rien de nouveau : ces jeux sont déjà rangés." : "Aucun jeu trouvé dans ce dossier.");
      if (autres) texte.textContent += " " + autres + " jeu(x) DS / Game Boy ou GameCube / Wii gardés pour plus tard.";
    });
  }
  if (window.retroApp) retroApp.version().then(v => { document.getElementById("version").textContent = "Rétro " + v; });
  // Bouton de mise à jour : cherche, télécharge puis redémarre sur la nouvelle version.
  if (window.retroApp && retroApp.majEtat) {
    const bouton = document.getElementById("maj");
    bouton.hidden = false;
    const TEXTES = {
      inconnue: ["Chercher une mise à jour"], "a-jour": ["À jour · revérifier"], recherche: ["Recherche…", true],
      developpement: ["Mises à jour : appli installée seulement", true], portable: ["Télécharger la nouvelle version"],
      erreur: ["Mise à jour impossible · réessayer"],
    };
    let etat = { phase: "inconnue" };
    const afficher = e => {
      etat = e;
      let [texte, inactif] = TEXTES[e.phase] || [];
      if (e.phase === "disponible") texte = "Mettre à jour vers " + e.nouvelle;
      if (e.phase === "telechargement") { texte = "Téléchargement " + (e.pourcent || 0) + " %"; inactif = true; }
      if (e.phase === "prete") texte = "Redémarrer pour passer à " + e.nouvelle;
      bouton.textContent = texte || "Chercher une mise à jour";
      bouton.disabled = Boolean(inactif);
      bouton.classList.toggle("nouvelle", e.phase === "disponible" || e.phase === "prete");
      bouton.title = e.phase === "erreur" ? e.erreur || "" : "";
    };
    retroApp.surMaj(afficher);
    retroApp.majEtat().then(afficher);
    bouton.addEventListener("click", () => {
      if (etat.phase === "disponible") return retroApp.majTelecharger();
      if (etat.phase === "prete") return retroApp.majInstaller();
      if (etat.phase === "portable") return retroApp.majPage();
      retroApp.majVerifier().then(afficher);
    });
  }
</script>
</body>
</html>
