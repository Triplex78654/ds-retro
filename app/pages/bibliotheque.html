<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<script src="theme.js"></script>
<title>Rétro · Bibliothèque</title>
<link rel="stylesheet" href="console/styles/00-polices.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="supports.css">
<style>
  main { padding: 22px 40px 40px; max-width: 1600px; margin: 0 auto; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; }
  .entete { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .entete p { margin: 0; color: var(--texte-2); }
  .outils { position: sticky; top: 61px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 0 14px; background: linear-gradient(var(--fond) 75%, transparent); }
  .filtres { display: flex; flex-wrap: wrap; gap: 6px; }
  .filtre { padding: 7px 13px; border-radius: 99px; font-size: 13px; }
  .filtre[aria-pressed="true"] { background: var(--accent-doux); border-color: var(--accent-bord); color: var(--texte); }
  .filtre b { color: var(--texte-2); font-weight: 600; margin-left: 2px; }
  .outils .espace { flex: 1; }
  .outils label.tri { display: flex; align-items: center; gap: 8px; color: var(--texte-2); font-size: 13px; }
  .grille-jeux { margin-top: 6px; }
  @media (max-width: 900px) { main { padding: 18px; } .outils { top: 100px; } }
</style>
</head>
<body>
<header class="barre-app">
  <a class="logo" href="accueil.html">Rétro</a>
  <nav class="nav-app" aria-label="Navigation principale">
    <a href="accueil.html">Accueil</a>
    <a href="bibliotheque.html" aria-current="page">Bibliothèque</a>
    <a href="reglages.html">Paramètres</a>
  </nav>
  <span class="espace"></span>
  <div class="champ-recherche" role="search">
    <label class="masque" for="q">Chercher un jeu</label>
    <input id="q" type="search" placeholder="Chercher un jeu…" autocomplete="off" data-recherche>
    <kbd>Ctrl K</kbd>
  </div>
</header>
<main>
  <div class="entete">
    <h1>Bibliothèque</h1>
    <p id="compte" role="status">Chargement de tes jeux…</p>
  </div>
  <div class="outils">
    <div class="filtres" id="filtres" role="group" aria-label="Filtrer par console"></div>
    <span class="espace"></span>
    <button type="button" class="btn filtre" id="favoris" aria-pressed="false">★ Favoris</button>
    <label class="tri">Trier
      <select id="tri">
        <option value="nom">Nom</option>
        <option value="recents">Lancés récemment</option>
        <option value="ajout">Ajoutés récemment</option>
        <option value="console">Console</option>
        <option value="taille">Taille</option>
      </select>
    </label>
    <div class="segments" role="radiogroup" aria-label="Affichage">
      <label><input type="radio" name="vue" value="grille" checked>Grille</label>
      <label><input type="radio" name="vue" value="liste">Liste</label>
    </div>
  </div>
  <ul class="grille-jeux" id="jeux" aria-label="Jeux">
    <li class="squelette"></li><li class="squelette"></li><li class="squelette"></li><li class="squelette"></li><li class="squelette"></li>
  </ul>
</main>
<script src="jeux.js"></script>
<script>
(function () {
  "use strict";
  const R = RetroJeux, $ = x => document.getElementById(x);
  const params = new URLSearchParams(location.search);
  // Réglages de la vue retenus d'une visite à l'autre (l'adresse de la page a la priorité).
  let vue = {};
  try { vue = JSON.parse(localStorage.getItem("retro-vue-bibliotheque") || "{}"); } catch (e) {}
  const etat = {
    q: params.get("q") || "", console: params.get("console") || "tous",
    favoris: params.get("favoris") === "1", tri: params.get("tri") || vue.tri || "nom", affichage: vue.affichage || "grille",
  };
  const retenir = () => { try { localStorage.setItem("retro-vue-bibliotheque", JSON.stringify({ tri: etat.tri, affichage: etat.affichage })); } catch (e) {} };
  let jeux = [];
  const sansAccents = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  function filtres() {
    const par = {};
    for (const j of jeux) par[j.console] = (par[j.console] || 0) + 1;
    const div = $("filtres"); div.innerHTML = "";
    const bouton = (id, nom, n) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "btn filtre";
      b.setAttribute("aria-pressed", String(etat.console === id));
      b.append(nom + " "); const s = document.createElement("b"); s.textContent = n; b.appendChild(s);
      b.addEventListener("click", () => { etat.console = id; afficher(); filtres(); });
      div.appendChild(b);
    };
    bouton("tous", "Toutes", jeux.length);
    for (const c of Object.values(R.CONSOLES)) if (par[c.id]) bouton(c.id, c.nom, par[c.id]);
  }

  function afficher() {
    const q = sansAccents(etat.q.trim()), fav = R.favoris();
    let liste = jeux.filter(j => (etat.console === "tous" || j.console === etat.console)
      && (!etat.favoris || fav.has(R.cle(j)))
      && (!q || sansAccents(R.nomLisible(j.nom)).includes(q) || sansAccents(R.CONSOLES[j.console].nom).includes(q)));
    const nom = (a, b) => R.nomLisible(a.nom).localeCompare(R.nomLisible(b.nom), "fr");
    const tris = {
      nom,
      recents: (a, b) => R.dernierLancement(b) - R.dernierLancement(a) || nom(a, b),
      ajout: (a, b) => (b.maj || b.ajoute || 0) - (a.maj || a.ajoute || 0) || nom(a, b),
      console: (a, b) => R.CONSOLES[a.console].nom.localeCompare(R.CONSOLES[b.console].nom, "fr") || nom(a, b),
      taille: (a, b) => (b.taille || 0) - (a.taille || 0) || nom(a, b),
    };
    liste.sort(tris[etat.tri] || nom);
    const ul = $("jeux"); ul.innerHTML = "";
    ul.classList.toggle("liste", etat.affichage === "liste");
    $("compte").textContent = jeux.length
      ? (liste.length === jeux.length ? jeux.length + (jeux.length > 1 ? " jeux" : " jeu") : liste.length + " sur " + jeux.length + " jeux")
      : "";
    if (!liste.length) {
      const vide = document.createElement("li"); vide.className = "vide";
      if (!jeux.length) vide.innerHTML = "<strong>Ta bibliothèque est vide</strong><p>Rétro cherche tes jeux tout seul dans Téléchargements, Bureau, Documents et tes autres disques. Tu peux aussi lui indiquer un dossier, ou poser tes jeux dans <code>Documents\\Rétro</code>, dans le dossier de leur console.</p><p><a class=\"btn principal\" href=\"reglages.html#dossiers\">Gérer mes dossiers de jeux</a></p>";
      else {
        vide.innerHTML = "<strong>Aucun jeu ne correspond</strong><p></p><p><button type=\"button\" class=\"btn\">Tout afficher</button></p>";
        vide.querySelector("p").textContent = etat.q ? "Rien pour « " + etat.q + " »" + (etat.favoris ? " dans tes favoris." : ".") : etat.favoris ? "Aucun favori ici : ouvre un jeu et touche l'étoile." : "";
        vide.querySelector("button").addEventListener("click", () => { etat.q = ""; $("q").value = ""; etat.favoris = false; etat.console = "tous"; $("favoris").setAttribute("aria-pressed", "false"); filtres(); afficher(); });
      }
      ul.appendChild(vide); return;
    }
    const frag = document.createDocumentFragment();
    liste.forEach((j, i) => {
      const li = document.createElement("li"); li.className = "jeu" + (i < 30 ? " apparait" : ""); li.style.setProperty("--i", Math.min(i, 14));
      const derniere = R.dernierLancement(j);
      const c = R.carte(j, { sousTitre: R.CONSOLES[j.console].nom + (derniere ? " · " + R.ilYA(derniere) : "") });
      c.addEventListener("click", () => { location.href = R.lienFiche(j); });
      li.appendChild(c); frag.appendChild(li);
    });
    ul.appendChild(frag);
  }

  async function charger() {
    jeux = await R.listerTout();
    if (etat.console !== "tous" && !R.CONSOLES[etat.console]) etat.console = "tous";
    filtres(); afficher();
  }

  $("q").value = etat.q;
  $("q").addEventListener("input", e => { etat.q = e.target.value; afficher(); });
  $("q").addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); const c = document.querySelector(".carte"); if (c) c.focus(); } });
  $("favoris").setAttribute("aria-pressed", String(etat.favoris));
  $("favoris").addEventListener("click", () => { etat.favoris = !etat.favoris; $("favoris").setAttribute("aria-pressed", String(etat.favoris)); afficher(); });
  $("tri").value = etat.tri;
  $("tri").addEventListener("change", e => { etat.tri = e.target.value; retenir(); afficher(); });
  document.querySelector(`input[name=vue][value="${etat.affichage}"]`).checked = true;
  for (const r of document.querySelectorAll("input[name=vue]")) r.addEventListener("change", e => { etat.affichage = e.target.value; retenir(); afficher(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement === $("q")) { $("q").blur(); } });

  R.navigation(".carte, .filtre", { retour: () => { location.href = "accueil.html"; } });
  if (window.retroApp && retroApp.surRecherche) retroApp.surRecherche(p => { if (p.etape === "fini" && p.resultat && p.resultat.ok) charger(); });
  addEventListener("focus", charger);
  charger().then(() => { if (!etat.q) { const c = document.querySelector(".carte"); if (c) c.focus({ preventScroll: true }); } else $("q").focus(); });
})();
</script>
</body>
</html>
